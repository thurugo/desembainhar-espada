<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Conhecimentos das Organizações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0; padding: 4px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-family: sans-serif; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
            background-size: cover; z-index: -1;
        }
        .glass-panel {
            background: rgba(0, 15, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(234, 179, 8, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
        .text-contour { text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
        
        .opcao-btn {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .opcao-btn:hover { background: rgba(0, 40, 80, 0.8); }
        .opcao-btn.selecionada {
            background: rgba(250, 204, 21, 0.2);
            border-color: #facc15;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
            transform: scale(1.02);
        }
        .opcao-btn.correta {
            background: rgba(34, 197, 94, 0.3) !important;
            border-color: #22c55e !important;
        }
        .opcao-btn.errada {
            background: rgba(239, 68, 68, 0.3) !important;
            border-color: #ef4444 !important;
        }
    </style>
</head>
<body class="p-4">

    <!-- CABEÇALHO -->
    <div class="w-full max-w-2xl flex justify-between items-center mb-4 mt-2 px-2">
        <div class="flex flex-col">
            <span id="nome-usuario" class="text-yellow-400 font-black text-lg uppercase italic text-contour">Guerreiro</span>
            <span class="text-blue-200 text-[10px] uppercase tracking-widest">Rodada: <span id="rodada-atual">0</span>/10</span>
        </div>
        <div class="text-right">
            <span class="block text-[10px] uppercase text-blue-300">Pontuação</span>
            <span id="pontos-totais" class="text-2xl font-black text-white">0</span>
        </div>
    </div>

    <!-- PAINEL CENTRAL DA ARENA -->
    <div id="arena-box" class="glass-panel w-full max-w-2xl p-6 rounded-3xl text-center shadow-2xl relative overflow-hidden">
        
        <!-- TELA DE CARREGAMENTO -->
        <div id="tela-carregamento" class="flex flex-col items-center justify-center py-10">
            <h2 class="text-xl font-black text-yellow-500 uppercase tracking-widest animate-pulse">Preparando Pergaminhos...</h2>
            <p id="status-org" class="text-xs text-blue-300 mt-2">Identificando Organização</p>
        </div>

        <!-- TELA DO JOGO (OCULTA INICIALMENTE) -->
        <div id="tela-jogo" class="hidden">
            
            <!-- CRONÔMETRO -->
            <div class="w-full bg-black/40 h-3 rounded-full overflow-hidden mb-2 border border-white/5">
                <div id="barra-tempo" class="bg-gradient-to-r from-green-400 to-emerald-500 h-full w-full transition-all duration-1000 linear"></div>
            </div>
            <div id="timer-text" class="text-3xl font-black text-yellow-500 mb-4">30s</div>

            <!-- INFORMAÇÕES DA PERGUNTA -->
            <div class="mb-4">
                <span id="nivel-pergunta" class="inline-block px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mb-2 border"></span>
                <h2 id="texto-pergunta" class="text-lg md:text-xl font-bold text-white leading-snug min-h-[60px] flex items-center justify-center">
                    <!-- Pergunta injetada via JS -->
                </h2>
            </div>

            <!-- FEEDBACK (Oculto) -->
            <div id="feedback-resposta" class="hidden py-3 px-4 rounded-xl border-2 text-center mb-4 font-bold text-sm bg-black/40"></div>

            <!-- OPÇÕES DE RESPOSTA -->
            <div id="container-opcoes" class="grid grid-cols-1 gap-2 mb-6 text-left">
                <!-- Botões injetados via JS -->
            </div>

            <!-- BOTÃO MESTRE DE AÇÃO -->
            <button id="btn-acao" onclick="confirmarResposta()" disabled
                class="w-full bg-gray-600 text-gray-400 font-black py-4 rounded-xl shadow-lg uppercase text-sm transition-all cursor-not-allowed">
                Selecione uma Alternativa
            </button>
        </div>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        const TEMPO_LIMITE = 30;
        let organizacaoJogador = "";
        let deckRodada = [];
        let indiceAtual = 0;
        let pontosAcumulados = 0;
        let tempoRestante = TEMPO_LIMITE;
        let timerInterval;
        let alternativaSelecionada = null;
        let bloqueiaCliques = false;

        window.onload = async () => {
            await inicializarModulo();
        };

        async function inicializarModulo() {
            try {
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                if (authError || !user) {
                    alert("Sessão expirada. Faça login novamente.");
                    window.location.href = 'login.html';
                    return;
                }

                // 1. Identifica a organização do jogador (ER ou MR)
                const { data: perfil } = await supabaseClient.from('perfis').select('nome, organizacao').eq('id', user.id).single();
                
                document.getElementById('nome-usuario').innerText = perfil.nome || "Guerreiro";
                organizacaoJogador = perfil.organizacao || "ER";
                document.getElementById('status-org').innerText = `Carregando acervo oficial: ${organizacaoJogador === 'ER' ? 'Embaixadores do Rei' : 'Mensageiras do Rei'}`;

                // 2. Define o arquivo JSON correto baseado na organização
                const nomeArquivo = organizacaoJogador === "ER" ? "gerais_er.json" : "gerais_mr.json";
                
                // 3. Busca o banco de perguntas
                const response = await fetch(nomeArquivo);
                if (!response.ok) throw new Error("Arquivo de perguntas não encontrado.");
                
                const jsonCarregado = await response.json();
                
                // O JSON possui o array raiz "questoes" conforme a estrutura das fontes
                const todasPerguntas = jsonCarregado.questoes || jsonCarregado; 

                // 4. Separação por Nível e Sorteio
                const faceis = todasPerguntas.filter(q => q.nivel.toLowerCase() === 'facil').sort(() => 0.5 - Math.random()).slice(0, 5);
                const medias = todasPerguntas.filter(q => q.nivel.toLowerCase() === 'medio').sort(() => 0.5 - Math.random()).slice(0, 3);
                const dificeis = todasPerguntas.filter(q => q.nivel.toLowerCase() === 'dificil').sort(() => 0.5 - Math.random()).slice(0, 2);

                // Une as 10 perguntas e embaralha a ordem final da rodada
                deckRodada = [...faceis, ...medias, ...dificeis].sort(() => 0.5 - Math.random());

                if(deckRodada.length < 10) {
                    alert("Atenção: O banco de dados não possui perguntas suficientes para formar as 10 rodadas nas proporções corretas.");
                }

                // 5. Inicia o Jogo
                document.getElementById('tela-carregamento').classList.add('hidden');
                document.getElementById('tela-jogo').classList.remove('hidden');
                
                carregarPergunta();

            } catch (error) {
                console.error(error);
                document.getElementById('status-org').innerText = "Erro ao carregar pergaminhos! Verifique os arquivos JSON.";
                document.getElementById('status-org').className = "text-xs text-red-400 font-bold mt-2";
            }
        }

        function carregarPergunta() {
            if (indiceAtual >= deckRodada.length) {
                finalizarJogo();
                return;
            }

            bloqueiaCliques = false;
            alternativaSelecionada = null;
            tempoRestante = TEMPO_LIMITE;
            
            const perguntaAtual = deckRodada[indiceAtual];
            
            document.getElementById('rodada-atual').innerText = indiceAtual + 1;
            document.getElementById('feedback-resposta').classList.add('hidden');
            
            // Estilização da tag de nível
            const tagNivel = document.getElementById('nivel-pergunta');
            tagNivel.innerText = `Nível: ${perguntaAtual.nivel}`;
            if(perguntaAtual.nivel.toLowerCase() === 'facil') tagNivel.className = "inline-block px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mb-2 border border-green-500 text-green-400 bg-green-900/30";
            else if(perguntaAtual.nivel.toLowerCase() === 'medio') tagNivel.className = "inline-block px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mb-2 border border-amber-500 text-amber-400 bg-amber-900/30";
            else tagNivel.className = "inline-block px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mb-2 border border-red-500 text-red-400 bg-red-900/30";

            document.getElementById('texto-pergunta').innerText = perguntaAtual.pergunta;

            // Renderizar as 4 opções a partir do objeto "opcoes"
            const containerOpcoes = document.getElementById('container-opcoes');
            containerOpcoes.innerHTML = "";
            
            const letras = ['A', 'B', 'C', 'D'];
            letras.forEach(letra => {
                const textoOpcao = perguntaAtual.opcoes[letra];
                if(textoOpcao) {
                    containerOpcoes.innerHTML += `
                        <button id="btn-op-${letra}" onclick="selecionarOpcao('${letra}')" 
                            class="opcao-btn w-full p-4 rounded-xl text-sm font-bold text-gray-300 flex gap-3 items-center">
                            <span class="bg-black/40 border border-white/10 w-8 h-8 rounded-lg flex items-center justify-center font-black text-yellow-500 shrink-0">${letra}</span>
                            <span class="flex-1">${textoOpcao}</span>
                        </button>
                    `;
                }
            });

            // Reseta botão mestre
            const btn = document.getElementById('btn-acao');
            btn.innerText = "Selecione uma Alternativa";
            btn.disabled = true;
            btn.className = "w-full bg-gray-600 text-gray-400 font-black py-4 rounded-xl shadow-lg uppercase text-sm transition-all cursor-not-allowed";
            btn.onclick = confirmarResposta;

            iniciarCronometro();
        }

        function selecionarOpcao(letra) {
            if (bloqueiaCliques) return;
            
            alternativaSelecionada = letra;
            
            // Remove seleção visual de todos e aplica apenas no selecionado
            ['A', 'B', 'C', 'D'].forEach(l => {
                const btn = document.getElementById(`btn-op-${l}`);
                if(btn) btn.classList.remove('selecionada');
            });
            document.getElementById(`btn-op-${letra}`).classList.add('selecionada');

            // Ativa botão mestre
            const btnAcao = document.getElementById('btn-acao');
            btnAcao.disabled = false;
            btnAcao.innerText = "Confirmar Resposta";
            btnAcao.className = "w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg uppercase text-lg transition-all active:scale-95";
        }

        function iniciarCronometro() {
            clearInterval(timerInterval);
            atualizarBarraTempo();
            document.getElementById('timer-text').innerText = `${tempoRestante}s`;

            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer-text').innerText = `${tempoRestante}s`;
                atualizarBarraTempo();

                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    processarResultado(true); // Estouro de tempo
                }
            }, 1000);
        }

        function atualizarBarraTempo() {
            const barra = document.getElementById('barra-tempo');
            const pct = (tempoRestante / TEMPO_LIMITE) * 100;
            barra.style.width = `${pct}%`;
            if (pct > 50) barra.className = "bg-gradient-to-r from-green-400 to-emerald-500 h-full w-full transition-all duration-1000 linear";
            else if (pct > 20) barra.className = "bg-gradient-to-r from-amber-400 to-orange-500 h-full w-full transition-all duration-1000 linear";
            else barra.className = "bg-gradient-to-r from-red-500 to-rose-600 h-full w-full transition-all duration-1000 linear";
        }

        function confirmarResposta() {
            if (bloqueiaCliques || !alternativaSelecionada) return;
            clearInterval(timerInterval);
            processarResultado(false);
        }

        function processarResultado(porEstouroTempo) {
            bloqueiaCliques = true;
            const perguntaAtual = deckRodada[indiceAtual];
            const letraCorreta = perguntaAtual.correta.toUpperCase();
            
            const feedbackDiv = document.getElementById('feedback-resposta');
            feedbackDiv.classList.remove('hidden');

            // Revela a cor visual dos botões
            if (!porEstouroTempo && alternativaSelecionada) {
                if (alternativaSelecionada === letraCorreta) {
                    // Acertou
                    document.getElementById(`btn-op-${alternativaSelecionada}`).classList.add('correta');
                    pontosAcumulados += tempoRestante;
                    document.getElementById('pontos-totais').innerText = pontosAcumulados;
                    
                    feedbackDiv.className = "py-3 px-4 rounded-xl border-2 border-green-500 text-center mb-4 font-bold text-sm bg-green-900/40 text-green-300";
                    feedbackDiv.innerText = `✓ Resposta Exata! Você garantiu +${tempoRestante} Pontos.`;
                } else {
                    // Errou
                    document.getElementById(`btn-op-${alternativaSelecionada}`).classList.add('errada');
                    document.getElementById(`btn-op-${letraCorreta}`).classList.add('correta');
                    
                    feedbackDiv.className = "py-3 px-4 rounded-xl border-2 border-red-500 text-center mb-4 font-bold text-sm bg-red-900/40 text-red-300";
                    feedbackDiv.innerText = `✗ Resposta Incorreta (0 Pontos). A alternativa certa era a letra ${letraCorreta}.`;
                }
            } else {
                // Estourou o tempo
                document.getElementById(`btn-op-${letraCorreta}`).classList.add('correta');
                feedbackDiv.className = "py-3 px-4 rounded-xl border-2 border-orange-500 text-center mb-4 font-bold text-sm bg-orange-900/40 text-orange-300";
                feedbackDiv.innerText = `⏱️ Tempo Esgotado! A alternativa certa era a letra ${letraCorreta}.`;
            }

            // Transforma o botão mestre para avançar
            const btnAcao = document.getElementById('btn-acao');
            btnAcao.disabled = false;
            
            if (indiceAtual < deckRodada.length - 1) {
                btnAcao.innerText = "PRÓXIMA PERGUNTA";
                btnAcao.className = "w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-4 rounded-xl shadow-lg uppercase text-lg transition-all active:scale-95 mt-4";
                btnAcao.onclick = () => {
                    indiceAtual++;
                    carregarPergunta();
                };
            } else {
                btnAcao.innerText = "SALVAR NO RANKING";
                btnAcao.className = "w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-xl shadow-lg uppercase text-lg transition-all active:scale-95 mt-4";
                btnAcao.onclick = enviarPontuacaoFinal;
            }
        }

        async function enviarPontuacaoFinal() {
            const btn = document.getElementById('btn-acao');
            btn.disabled = true; 
            btn.innerText = "SALVANDO...";

            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                const { error } = await supabaseClient
                    .from('ranking')
                    .insert([{ 
                        jogador_id: user.id, 
                        pontos: pontosAcumulados,
                        modulo: 'organizacoes' // Tag do novo módulo
                    }]);

                if (error) throw error;

                alert(`Missão Cumprida! Sua pontuação de ${pontosAcumulados} pontos foi salva no Ranking de Organizações!`);
                window.location.href = 'ranking.html';

            } catch (err) {
                console.error(err);
                alert(`Erro ao salvar os pontos: ${err.message || err}`);
                btn.disabled = false; 
                btn.innerText = "SALVAR NO RANKING";
            }
        }
    </script>
</body>
</html>
