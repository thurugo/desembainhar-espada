<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desembainhar Espada - Início</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; padding: 4px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-family: sans-serif; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* ATUALIZADO: Novo arquivo leve em formato .webp e alinhado ao topo */
            background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
            background-size: cover; z-index: -1;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.5); /* 50% de Transparência */
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
        .text-contour {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
    </style>
</head>
<body class="p-4">

    <div class="glass-panel w-full max-w-md p-6 rounded-3xl text-center shadow-2xl">
        
        <div class="flex justify-center items-center space-x-8 mb-6 mt-2">
            <img src="imagens/logo-er.png" alt="Embaixadores do Rei" class="w-[50px] h-[50px] object-contain drop-shadow-[0_4px_6px_rgba(0,0,0,0.6)]">
            
            <div class="h-8 w-[2px] bg-yellow-500/40"></div>
            
            <img src="imagens/logo-mr.png" alt="Mensageiras do Rei" class="w-[50px] h-[50px] object-contain drop-shadow-[0_4px_6px_rgba(0,0,0,0.6)]">
        </div>

        <div class="mb-6">
            <h1 class="text-3xl font-black text-yellow-400 uppercase tracking-tighter italic text-contour">
                Desembainhar Espada
            </h1>
            <p class="text-blue-200 text-[10px] uppercase tracking-[0.3em] mt-1">Gincana de Agilidade Bíblica</p>
        </div>

        <div class="space-y-3.5 w-full">
            
            <a href="arena.html" 
                class="block w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-4 rounded-2xl shadow-xl uppercase text-center text-md transition-all active:scale-95">
                Entrar na Arena
            </a>

            <a href="cadastro.html" 
                class="block w-full bg-green-600 hover:bg-green-500 text-white font-black py-3.5 rounded-2xl shadow-lg uppercase text-center text-sm transition-all active:scale-95 border border-green-500/30">
                🛡️ Criar Conta / Cadastro
            </a>

            <a href="ranking.html" 
                class="block w-full bg-blue-900/60 hover:bg-blue-900/80 text-white font-bold py-3.5 rounded-2xl border border-blue-500/30 uppercase text-center text-sm transition-all active:scale-95">
                🏆 Ver Quadro de Líderes
            </a>

            <a href="instrucoes.html" 
                class="block w-full bg-black/40 hover:bg-black/60 text-yellow-500 font-bold py-3 rounded-2xl border border-yellow-500/20 uppercase text-center text-xs transition-all active:scale-95">
                📖 Como Funciona o Jogo
            </a>
        </div>

        <div class="mt-8 text-[9px] text-blue-300/60 uppercase tracking-widest font-mono">
            Vitória • ES
        </div>

    </div>

</body>
</html>
