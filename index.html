<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desembainhar Espada - Início</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    body {
        margin: 0;
        padding: 4px; /* Mantém o espaçamento das páginas */
        min-height: 100vh;
        display: flex; 
        flex-direction: column; 
        align-items: center;
        color: white; 
        font-family: sans-serif;
        position: relative;
    }

    /* Camada de fundo responsiva e blindada contra bugs de celular */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('imagens/fundo_entrada.png') no-repeat center center;
        /* 'cover' expande a imagem para preencher toda a tela sem distorcer. */
        background-size: cover; 
        z-index: -1;
        
        /* NOTA TÉCNICA: Se a sua imagem de fundo tiver elementos essenciais nas bordas 
           e você preferir que ela NUNCA corte nenhum detalhe (mesmo que fiquem faixas pretas 
           nas laterais em telas muito compridas), remova as duas barras '//' da linha abaixo: */
        /* background-size: contain; */
    }

    .glass-panel {
        background: rgba(0, 20, 40, 0.96); 
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }
    .pulse-red { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    select { background: rgba(0, 20, 40, 0.8); border: 1px solid rgba(255, 215, 0, 0.3); color: white; }
    option { background: #001428; color: white; }
</style>
</head>
<body class="p-4">
    <div class="glass-panel max-w-md w-full p-8 md:p-12 rounded-3xl text-center text-white">
        <!-- Título em Amarelo para contraste máximo sobre o fundo azul sólido -->
        <h1 class="text-4xl font-black text-yellow-400 uppercase tracking-tighter mb-4 shadow-sm">
            Desembainhar Espada
        </h1>
        
        <p class="text-blue-100 mb-10 italic text-sm leading-relaxed">
            "Lâmpada para os meus pés é tua palavra e luz, para o meu caminho."
        </p>

        <div class="space-y-5">
            <a href="login.html" class="block w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-4 rounded-xl transition-all transform hover:scale-105 shadow-lg uppercase">
                Entrar na Arena
            </a>

            <a href="cadastro.html" class="block w-full border-2 border-white/30 hover:border-yellow-400 hover:text-yellow-400 text-white font-bold py-4 rounded-xl transition-all uppercase text-sm">
                Criar Minha Conta
            </a>
        </div>
        
        <div class="mt-12 pt-6 border-t border-white/10 opacity-60">
            <p class="text-[10px] text-gray-300 uppercase tracking-[0.3em]">Eis-me Aqui</p>
        </div>
    </div>
</body>
</html>
