<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
            background-size: cover; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            color: white; font-family: sans-serif;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.96); backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.3); color: white; }
        option { background: #001428; color: white; }
    </style>
</head>
<body class="p-4">

    <!-- Cabeçalho -->
    <div class="w-full max-w-2xl flex justify-between items-center mb-4 mt-2 px-2">
        <div class="flex flex-col">
            <span id="nome-usuario" class="text-yellow-400 font-black text-lg uppercase italic">Guerreiro</span>
            <span class="text-blue-200 text-[10px] uppercase tracking-widest">Rodada: <span id="rodada-atual">0</span>/10</span>
        </div>
        <div class="text-right">
            <span class="block text-[10px] uppercase text-blue-300">Pontos</span>
            <span id="pontos-totais" class="text-2xl font-black text-white">0</span>
        </div>
    </div>

    <!-- Arena -->
    <div id="arena-box" class="glass-panel w-full max-w-2xl p-6 rounded-3xl text-center shadow-2xl">
        
        <div id="seletor-container" class="mb-6">
            <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-2">Escolha sua Versão:</label>
            <select id="versao-biblia" class="w-full p-4 rounded-xl outline-none">
                <option value="nvi.json">NVI - Nova Versão Internacional</option>
                <option value="acf.json">ACF - Almeida Corrigida e Fiel</option>
                <option value="aa.json">AA - Almeida Revisada (Imprensa Bíblica)</option>
            </select>
        </div>

        <div id="timer-display" class="text-6xl font-black text-yellow-500 mb-4">60</div>

        <div id="display-sorteio">
            <h2 id="endereco" class="text-3xl md:text-5xl font-black text-white mb-2 uppercase tracking-tighter min-h-[80px] flex items-center justify-center">---</h2>
            <p id="instrucao" class="text-blue-200 text-[10px] mb-6 uppercase tracking-widest italic">Aguardando início</p>
        </div>

        <div id="ia-area" class="hidden mb-6">
            <div class="inline-block mb-3 text-[10px] bg-red-600 px-3 py-1 rounded-full font-bold uppercase pulse-red">Escutando...</div>
            <div class="bg-black/40 p-4 rounded-xl border border-white/10 min-h-[60px] flex items-center justify-center">
                <p id="texto-capturado" class="text-blue-100 italic text-sm">"Lendo..."</p>
            </div>
        </div>

        <button id="btn-acao" onclick="gerenciarRodada()" 
            class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95">
            Começar Gincana
        </button>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let bibliaData = null, rodada = 0, pontosAcumulados = 0, tempoRestante = 60, timerInterval, textoOficial = "";
        let recognition;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = true;
            recognition.continuous = true;
        }

        async function gerenciarRodada() {
            const btn = document.getElementById('btn-acao');
            const seletorDiv = document.getElementById('seletor-container');
            
            if (btn.innerText === "COMEÇAR GINCANA") {
                const versao = document.getElementById('versao-biblia').value;
                btn.disabled = true;
                btn.innerText = "CARREGANDO...";

                // Tenta carregar o arquivo da RAIZ do seu projeto
                try {
                    const response = await fetch(`${window.location.origin}/${versao}`);
                    if (!response.ok) throw new Error(`Erro 404: Arquivo ${versao} não encontrado.`);
                    
                    bibliaData = await response.json();
                    seletorDiv.classList.add('hidden');
                    iniciarSorteio();
                } catch (e) {
                    console.error(e);
                    alert(`Não foi possível carregar o arquivo "${versao}". Verifique se ele está na raiz do seu GitHub.`);
                    btn.disabled = false;
                    btn.innerText = "COMEÇAR GINCANA";
                }
            } else if (btn.innerText === "PRÓXIMA RODADA") {
                iniciarSorteio();
            } else if (btn.innerText === "ENCONTREI!") {
                ativarVoz();
            }
        }

        function iniciarSorteio() {
            rodada++;
            document.getElementById('rodada-atual').innerText = rodada;
            
            // Lógica de sorteio adaptada para JSONs padrão
            const livro = bibliaData[Math.floor(Math.random() * bibliaData.length)];
            const capIdx = Math.floor(Math.random() * livro.chapters.length);
            const verIdx = Math.floor(Math.random() * livro.chapters[capIdx].length);
            
            textoOficial = livro.chapters[capIdx][verIdx];
            document.getElementById('endereco').innerText = `${livro.name} ${capIdx + 1}:${verIdx + 1}`;
            document.getElementById('instrucao').innerText = "ENCONTRE E LEIA!";
            
            tempoRestante = 60;
            iniciarTimer();

            const btn = document.getElementById('btn-acao');
            btn.disabled = false;
            btn.innerText = "ENCONTREI!";
            btn.classList.replace('bg-yellow-500', 'bg-green-500');
            btn.classList.add('text-white');
        }

        function iniciarTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-display').innerText = tempoRestante;
            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer-display').innerText = tempoRestante;
                if (tempoRestante <= 0) finalizarRodada(false);
            }, 1000);
        }

        function ativarVoz() {
            if (!recognition) { alert("Sem suporte a voz."); finalizarRodada(true); return; }
            document.getElementById('ia-area').classList.remove('hidden');
            document.getElementById('btn-acao').innerText = "ESCUTANDO...";
            document.getElementById('btn-acao').disabled = true;
            recognition.start();

            recognition.onresult = (event) => {
                const transcricao = Array.from(event.results).map(r => r[0].transcript).join('');
                document.getElementById('texto-capturado').innerText = `"${transcricao}"`;
                const limpar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '');
                if (limpar(transcricao).includes(limpar(textoOficial).substring(0, 10))) {
                    finalizarRodada(true);
                }
            };
        }

        async function finalizarRodada(sucesso) {
            clearInterval(timerInterval);
            if(recognition) try { recognition.stop(); } catch(e) {}
            document.getElementById('ia-area').classList.add('hidden');
            if (sucesso) {
                pontosAcumulados += tempoRestante;
                document.getElementById('pontos-totais').innerText = pontosAcumulados;
            }
            const btn = document.getElementById('btn-acao');
            btn.disabled = false;
            btn.classList.replace('bg-green-500', 'bg-yellow-500');
            btn.classList.remove('text-white');
            if (rodada < 10) { btn.innerText = "PRÓXIMA RODADA"; } 
            else { btn.innerText = "SALVAR NO RANKING"; btn.onclick = enviarPontuacao; }
        }

        async function enviarPontuacao() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                await supabaseClient.from('ranking').insert([{ perfil_id: user.id, pontuacao: pontosAcumulados }]);
                window.location.href = 'ranking.html';
            }
        }

        window.onload = () => {
            document.getElementById('nome-usuario').innerText = localStorage.getItem('usuario_nome') || "Guerreiro";
        };
    </script>
</body>
</html>
