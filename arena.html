<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
            background-size: cover; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            color: white; font-family: sans-serif;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.96); backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-4">

    <!-- Status da Gincana -->
    <div class="w-full max-w-2xl flex justify-between items-center mb-4 mt-2 px-2">
        <div class="flex flex-col">
            <span id="nome-usuario" class="text-yellow-400 font-black text-lg uppercase italic">Guerreiro</span>
            <span class="text-blue-200 text-[10px] uppercase tracking-widest">Rodada: <span id="rodada-atual">0</span>/10</span>
        </div>
        <div class="text-right">
            <span class="block text-[10px] uppercase text-blue-300">Pontuação Total</span>
            <span id="pontos-totais" class="text-2xl font-black text-white">0</span>
        </div>
    </div>

    <!-- Arena Central -->
    <div id="arena-box" class="glass-panel w-full max-w-2xl p-6 rounded-3xl text-center shadow-2xl">
        <div id="timer-display" class="text-6xl font-black text-yellow-500 mb-4">60</div>

        <div id="display-sorteio">
            <h2 id="endereco" class="text-3xl md:text-5xl font-black text-white mb-2 uppercase tracking-tighter min-h-[80px] flex items-center justify-center">---</h2>
            <p id="instrucao" class="text-blue-200 text-[10px] mb-6 uppercase tracking-widest italic">Aguardando início do jogo...</p>
        </div>

        <div id="ia-area" class="hidden mb-6">
            <div id="indicador-voz" class="inline-block mb-3 text-[10px] bg-red-600 px-3 py-1 rounded-full font-bold uppercase pulse-red">IA Escutando...</div>
            <div class="bg-black/40 p-4 rounded-xl border border-white/10 min-h-[60px] flex items-center justify-center">
                <p id="texto-capturado" class="text-blue-100 italic text-sm">"Inicie a leitura em voz alta..."</p>
            </div>
        </div>

        <button id="btn-acao" onclick="gerenciarRodada()" 
            class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95">
            Carregando Espada...
        </button>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let bibliaCompleta = null;
        let rodada = 0, pontosAcumulados = 0, tempoRestante = 60, timerInterval, textoOficial = "";
        let recognition;

        // Configuração da Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = true;
            recognition.continuous = true;
        }

        // 1. Carrega toda a Bíblia (66 livros) ao abrir a página
        async function carregarBiblia() {
            const btn = document.getElementById('btn-acao');
            try {
                const response = await fetch('https://raw.githubusercontent.com/thiagobodruk/biblia/master/json/pt_almeida.json');
                bibliaCompleta = await response.json();
                btn.innerText = "COMEÇAR GINCANA";
            } catch (e) {
                btn.innerText = "ERRO AO CARREGAR";
                alert("Falha ao baixar banco de dados bíblico.");
            }
        }

        // 2. Lógica das Rodadas
        async function gerenciarRodada() {
            const btn = document.getElementById('btn-acao');
            if (btn.innerText === "COMEÇAR GINCANA" || btn.innerText === "PRÓXIMA RODADA") {
                iniciarSorteio();
            } else if (btn.innerText === "ENCONTREI!") {
                ativarVoz();
            }
        }

        function iniciarSorteio() {
            if (!bibliaCompleta) return;
            rodada++;
            document.getElementById('rodada-atual').innerText = rodada;
            
            // Sorteio em toda a Bíblia
            const livroSorteado = bibliaCompleta[Math.floor(Math.random() * bibliaCompleta.length)];
            const capIdx = Math.floor(Math.random() * livroSorteado.chapters.length);
            const verIdx = Math.floor(Math.random() * livroSorteado.chapters[capIdx].length);
            
            textoOficial = livroSorteado.chapters[capIdx][verIdx];
            document.getElementById('endereco').innerText = `${livroSorteado.name} ${capIdx + 1}:${verIdx + 1}`;
            document.getElementById('instrucao').innerText = "ENCONTRE NA BÍBLIA FÍSICA!";
            
            tempoRestante = 60;
            iniciarTimer();

            const btn = document.getElementById('btn-acao');
            btn.innerText = "ENCONTREI!";
            btn.classList.replace('bg-yellow-500', 'bg-green-500');
            btn.classList.add('text-white');
        }

        function iniciarTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-display').innerText = tempoRestante;
            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer-display').innerText = tempoRestante;
                if (tempoRestante <= 0) finalizarRodada(false);
            }, 1000);
        }

        function ativarVoz() {
            if (!recognition) {
                alert("Navegador sem suporte a voz.");
                finalizarRodada(true);
                return;
            }
            document.getElementById('ia-area').classList.remove('hidden');
            document.getElementById('btn-acao').innerText = "ESCUTANDO...";
            document.getElementById('btn-acao').disabled = true;
            recognition.start();

            recognition.onresult = (event) => {
                const transcricao = Array.from(event.results).map(r => r[0].transcript).join('');
                document.getElementById('texto-capturado').innerText = `"${transcricao}"`;
                
                const limpar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '');
                if (limpar(transcricao).includes(limpar(textoOficial).substring(0, 10))) {
                    finalizarRodada(true);
                }
            };
        }

        async function finalizarRodada(sucesso) {
            clearInterval(timerInterval);
            if(recognition) try { recognition.stop(); } catch(e) {}
            document.getElementById('ia-area').classList.add('hidden');
            
            if (sucesso) {
                pontosAcumulados += tempoRestante;
                document.getElementById('pontos-totais').innerText = pontosAcumulados;
            }

            const btn = document.getElementById('btn-acao');
            btn.disabled = false;
            btn.classList.replace('bg-green-500', 'bg-yellow-500');
            btn.classList.remove('text-white');

            if (rodada < 10) {
                btn.innerText = "PRÓXIMA RODADA";
            } else {
                btn.innerText = "SALVAR NO RANKING";
                btn.onclick = enviarPontuacao;
            }
        }

        async function enviarPontuacao() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                await supabaseClient.from('ranking').insert([{ perfil_id: user.id, pontuacao: pontosAcumulados }]);
                window.location.href = 'ranking.html';
            }
        }

        window.onload = () => {
            document.getElementById('nome-usuario').innerText = localStorage.getItem('usuario_nome') || "Guerreiro";
            carregarBiblia();
        };
    </script>
</body>
</html>
