<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0; padding: 4px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            color: white; font-family: sans-serif; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
            background-size: cover; z-index: -1;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.5); /* 50% de Transparência */
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        select { background: rgba(0, 20, 40, 0.8); border: 1px solid rgba(255, 215, 0, 0.3); color: white; }
        option { background: #001428; color: white; }
        .text-contour {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
    </style>
</head>
<body class="p-4">

    <div class="w-full max-w-2xl flex justify-between items-center mb-4 mt-2 px-2">
        <div class="flex flex-col">
            <span id="nome-usuario" class="text-yellow-400 font-black text-lg uppercase italic text-contour">Guerreiro</span>
            <span class="text-blue-200 text-[10px] uppercase tracking-widest">Rodada: <span id="rodada-atual">0</span>/10</span>
        </div>
        <div class="text-right">
            <span class="block text-[10px] uppercase text-blue-300">Pontuação Total</span>
            <span id="pontos-totais" class="text-2xl font-black text-white">0</span>
        </div>
    </div>

    <div id="arena-box" class="glass-panel w-full max-w-2xl p-6 rounded-3xl text-center shadow-2xl">
        
        <div id="seletor-container" class="mb-6">
            <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-2 tracking-widest">Versão da Espada:</label>
            <select id="versao-biblia" class="w-full p-4 rounded-xl outline-none mb-4">
                <option value="NVI.json">NVI - Nova Versão Internacional</option>
                <option value="ACF.json">ACF - Almeida Corrigida e Fiel</option>
                <option value="ARA.json">ARA - Almeida Revista e Atualizada</option>
                <option value="ARC.json">ARC - Almeida Revista e Corrigida</option>
                <option value="NTLH.json">NTLH - Nova Trad. na Linguagem de Hoje</option>
            </select>
        </div>

        <div id="timer-display" class="text-6xl font-black text-yellow-500 mb-2">60</div>
        
        <div id="anti-trapaca-container" class="hidden bg-red-900/40 p-3 rounded-xl border border-red-500/50 mb-4">
            <span class="block text-[10px] uppercase text-red-200 font-bold tracking-widest">Inicie a leitura em:</span>
            <span id="timer-voz" class="text-3xl font-black text-red-500">5</span>
        </div>

        <div id="display-sorteio">
            <h2 id="endereco" class="text-3xl md:text-5xl font-black text-white mb-2 uppercase tracking-tighter min-h-[80px] flex items-center justify-center">---</h2>
            <div id="resultado-rodada" class="hidden py-4 px-6 rounded-2xl mb-4 text-sm border-2"></div>
        </div>

        <div id="ia-area" class="hidden mb-6">
            <div class="inline-block mb-3 text-[10px] bg-red-600 px-3 py-1 rounded-full font-bold uppercase pulse-red">IA Escutando...</div>
            <div class="bg-black/40 p-4 rounded-xl border border-white/10 min-h-[60px] flex items-center justify-center">
                <p id="texto-capturado" class="text-blue-100 italic text-sm">"Aguardando voz..."</p>
            </div>
        </div>

        <button id="btn-acao" onclick="gerenciarRodada()" 
            class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95">
            Começar Gincana
        </button>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let bibliaData = null, rodada = 0, pontosAcumulados = 0, tempoRestante = 60, timerInterval, textoOficial = "";
        let pontosReserva = 0, transcricaoFinal = "", antiTrapacaInterval, vozDetectada = false;
        let recognition;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = true;
            recognition.continuous = true;
        }

        async function gerenciarRodada() {
            const btn = document.getElementById('btn-acao');
            if (btn.innerText === "COMEÇAR GINCANA") {
                if(recognition) try { recognition.start(); setTimeout(() => recognition.stop(), 500); } catch(e){}
                const versao = document.getElementById('versao-biblia').value;
                btn.disabled = true; btn.innerText = "FORJANDO...";
                try {
                    const response = await fetch(`./biblias/${versao}`);
                    bibliaData = await response.json();
                    document.getElementById('seletor-container').classList.add('hidden');
                    iniciarSorteio();
                } catch (e) { alert("Erro ao carregar arquivos da Bíblia."); btn.disabled = false; btn.innerText = "COMEÇAR GINCANA"; }
            } else if (btn.innerText === "PRÓXIMA RODADA") {
                iniciarSorteio();
            } else if (btn.innerText === "ENCONTREI!") {
                cliqueEncontrei();
            } else if (btn.innerText === "FINALIZAR LEITURA") {
                processarValidacao();
            }
        }

        function iniciarSorteio() {
            rodada++;
            vozDetectada = false;
            transcricaoFinal = "";
            document.getElementById('texto-capturado').innerText = "Aguardando voz...";
            document.getElementById('rodada-atual').innerText = rodada;
            document.getElementById('ia-area').classList.add('hidden');
            document.getElementById('resultado-rodada').classList.add('hidden');
            document.getElementById('anti-trapaca-container').classList.add('hidden');
            document.getElementById('timer-display').classList.remove('hidden');
            
            const livro = bibliaData[Math.floor(Math.random() * bibliaData.length)];
            const capIdx = Math.floor(Math.random() * livro.chapters.length);
            const verIdx = Math.floor(Math.random() * livro.chapters[capIdx].length);
            
            textoOficial = livro.chapters[capIdx][verIdx];
            document.getElementById('endereco').innerText = `${livro.name} ${capIdx + 1}:${verIdx + 1}`;
            
            tempoRestante = 60;
            iniciarTimer();

            const btn = document.getElementById('btn-acao');
            btn.disabled = false; btn.innerText = "ENCONTREI!";
            btn.className = "w-full bg-green-500 text-white font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95";
        }

        function iniciarTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-display').innerText = tempoRestante;
            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer-display').innerText = tempoRestante;
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    finalizarRodada(false);
                }
            }, 1000);
        }

        function cliqueEncontrei() {
            clearInterval(timerInterval);
            pontosReserva = tempoRestante; 
            document.getElementById('timer-display').classList.add('hidden'); 
            
            const containerVoz = document.getElementById('anti-trapaca-container');
            const displayVoz = document.getElementById('timer-voz');
            containerVoz.classList.remove('hidden');
            
            let tempoVoz = 5;
            displayVoz.innerText = tempoVoz;
            
            antiTrapacaInterval = setInterval(() => {
                tempoVoz--;
                displayVoz.innerText = tempoVoz;
                if (tempoVoz <= 0) {
                    clearInterval(antiTrapacaInterval);
                    if (!vozDetectada) {
                        alert("Tempo limite esgotado para iniciar a leitura!");
                        finalizarRodada(false);
                    }
                }
            }, 1000);

            document.getElementById('ia-area').classList.remove('hidden');
            const btn = document.getElementById('btn-acao');
            btn.innerText = "FINALIZAR LEITURA";
            btn.className = "w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95";

            if(recognition) {
                recognition.start();
                recognition.onresult = (event) => {
                    vozDetectada = true;
                    clearInterval(antiTrapacaInterval); 
                    containerVoz.classList.add('hidden');
                    transcricaoFinal = Array.from(event.results).map(r => r[0].transcript).join('');
                    document.getElementById('texto-capturado').innerText = `"${transcricaoFinal}"`;
                };
            }
        }

        function processarValidacao() {
            if(recognition) try { recognition.stop(); } catch(e){}
            
            const limpar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '');
            const oficial = limpar(textoOficial);
            const falado = limpar(transcricaoFinal);

            const sucesso = falado.includes(oficial.substring(0, 10)) && vozDetectada;
            exibirMensagemResultado(sucesso);
        }

        // NOVA FUNÇÃO: Gera a marcação de palavras erradas em vermelho
        function gerarAuditoriaTexto(oficial, falado) {
            const limparPalavra = (p) => p.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').trim();
            
            const listaOficialLimpa = oficial.split(/\s+/).map(limparPalavra);
            const listaFaladaOriginal = falado.split(/\s+/);
            
            let htmlResultado = "";
            
            listaFaladaOriginal.forEach(palavra => {
                if (!palavra) return;
                const pLimpa = limparPalavra(palavra);
                
                // Se a palavra dita existe dentro do versículo oficial, fica verde. Se não, fica vermelha.
                if (listaOficialLimpa.includes(pLimpa)) {
                    htmlResultado += `<span class="text-green-400">${palavra}</span> `;
                } else {
                    htmlResultado += `<span class="text-red-500 font-bold underline decoration-wavy">${palavra}</span> `;
                }
            });
            
            return htmlResultado || `<span class="text-gray-500 italic">Nenhum som legível detectado pela IA.</span>`;
        }

        function exibirMensagemResultado(sucesso) {
            const msgDiv = document.getElementById('resultado-rodada');
            msgDiv.classList.remove('hidden');
            
            // Renderiza os dois blocos comparativos
            const auditoriaLeitura = gerarAuditoriaTexto(textoOficial, transcricaoFinal);
            
            let templateHTML = "";
            
            if (sucesso) {
                templateHTML = `<div class="text-center text-green-400 font-black text-xl uppercase italic mb-3">✓ Rodada Válida! +${pontosReserva} Pontos</div>`;
                msgDiv.className = "py-4 px-5 rounded-2xl border-2 border-green-500 text-left bg-green-950/40 backdrop-blur-sm mb-4 animate-fade-in";
            } else {
                templateHTML = `<div class="text-center text-red-500 font-black text-xl uppercase italic mb-3">✗ Rodada Inválida! (0 Pontos)</div>`;
                msgDiv.className = "py-4 px-5 rounded-2xl border-2 border-red-500 text-left bg-red-955/40 backdrop-blur-sm mb-4 animate-fade-in";
            }
            
            // Bloco visual de Transparência
            templateHTML += `
                <div class="mt-2 pt-3 border-t border-white/10 text-xs space-y-3 font-sans normal-case tracking-normal">
                    <div>
                        <span class="block text-yellow-500 font-black uppercase text-[10px] tracking-wider">📖 Texto Esperado (Versão Escolhida):</span>
                        <p class="text-white italic bg-black/30 p-2.5 rounded-xl mt-1 border border-white/5 select-none">${textoOficial}</p>
                    </div>
                    <div>
                        <span class="block text-yellow-500 font-black uppercase text-[10px] tracking-wider">🎙️ Texto Capturado (Sua Leitura):</span>
                        <p class="text-blue-100 bg-black/30 p-2.5 rounded-xl mt-1 border border-white/5">${auditoriaLeitura}</p>
                    </div>
                </div>
            `;
            
            msgDiv.innerHTML = templateHTML;
            finalizarRodada(sucesso);
        }

        async function finalizarRodada(sucesso) {
            clearInterval(timerInterval);
            clearInterval(antiTrapacaInterval);
            document.getElementById('anti-trapaca-container').classList.add('hidden');
            document.getElementById('ia-area').classList.add('hidden');
            
            if (sucesso) {
                pontosAcumulados += pontosReserva;
                document.getElementById('pontos-totais').innerText = pontosAcumulados;
            }

            const btn = document.getElementById('btn-acao');
            btn.className = "w-full bg-yellow-500 text-blue-900 font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95";

            if (rodada < 10) {
                btn.innerText = "PRÓXIMA RODADA";
                btn.onclick = gerenciarRodada;
            } else {
                btn.innerText = "SALVAR NO RANKING";
                btn.onclick = enviarPontuacao;
            }
        }

        async function enviarPontuacao() {
    // Captura o botão de ação principal da Arena
    const btn = document.getElementById('btn-acao');
    btn.disabled = true;
    btn.innerText = "SALVANDO...";
    
    try {
        // 1. Auditoria de Segurança: Busca o usuário autenticado direto no Supabase Auth
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
        
        // Bloqueio preventivo caso a sessão tenha caído durante as 10 rodadas
        if (authError || !user) {
            alert("Sessão de jogo expirada ou inválida. Por favor, faça login novamente para não perder seus pontos.");
            window.location.href = 'login.html';
            return;
        }

        // 2. Envio Estruturado para a tabela 'ranking'
        // Inclui a coluna 'modulo' para podermos filtrar na página ranking.html
        const { error } = await supabaseClient
            .from('ranking')
            .insert([
                { 
                    jogador_id: user.id, 
                    pontos: pontosAcumulados,
                    modulo: 'regular' // Identifica que esta pontuação pertence ao módulo Tradicional
                }
            ]);

        // 3. Tratamento de Erros Críticos do Banco de Dados
        if (error) {
            console.error("Erro interno retornado pelo Supabase:", error);
            
            // Se cair no erro de chave estrangeira que consertamos manualmente
            if (error.message.includes("foreign key constraint")) {
                throw new Error("Seu perfil de jogador não foi localizado na tabela de 'perfis'. Peça ao administrador para validar seu cadastro no painel.");
            }
            throw error;
        }

        // 4. Sucesso Absoluto e Redirecionamento
        alert(`Excelente! Sua pontuação de ${pontosAcumulados} pontos foi salva com sucesso no módulo Tradicional!`);
        window.location.href = 'ranking.html';

    } catch (err) {
        console.error("Erro completo interceptado no processo de gravação:", err);
        alert(`Não foi possível salvar os pontos.\nMotivo: ${err.message || err}`);
        
        // REATIVAÇÃO DE SEGURANÇA: Se der erro na rede ou no banco, o jogador NÃO perde os pontos da tela
        // Ele pode clicar de novo assim que você ajustar o perfil dele no Supabase
        btn.disabled = false;
        btn.innerText = "SALVAR NO RANKING";
    }
}

        window.onload = () => {
            document.getElementById('nome-usuario').innerText = localStorage.getItem('usuario_nome') || "Guerreiro";
        };
    </script>
</body>
</html>
