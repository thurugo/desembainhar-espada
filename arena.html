<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-family: sans-serif;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.96);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-4">

    <!-- Cabeçalho de Status -->
    <div class="w-full max-w-2xl flex justify-between items-center mb-4 mt-2 px-2">
        <div class="flex flex-col">
            <span id="nome-usuario" class="text-yellow-400 font-black text-lg uppercase italic">Guerreiro</span>
            <span class="text-blue-200 text-[10px] uppercase tracking-widest">Rodada: <span id="rodada-atual">0</span>/10</span>
        </div>
        <div class="text-right">
            <span class="block text-[10px] uppercase text-blue-300">Pontos Totais</span>
            <span id="pontos-totais" class="text-2xl font-black text-white">0</span>
        </div>
    </div>

    <!-- Painel de Jogo -->
    <div id="arena-box" class="glass-panel w-full max-w-2xl p-6 rounded-3xl text-center shadow-2xl">
        
        <!-- Timer Regressivo -->
        <div id="timer-display" class="text-5xl font-black text-yellow-500 mb-4 transition-colors">60</div>

        <div id="display-sorteio">
            <h2 id="endereco" class="text-4xl md:text-5xl font-black text-white mb-2 uppercase tracking-tighter">---</h2>
            <p id="instrucao" class="text-blue-200 text-[10px] mb-6 uppercase tracking-widest italic">Aguardando início</p>
        </div>

        <!-- Feedback da IA de Voz -->
        <div id="ia-area" class="hidden mb-6">
            <div id="indicador-voz" class="inline-block mb-3 text-[10px] bg-red-600 px-3 py-1 rounded-full font-bold uppercase pulse-red">Escutando Leitura...</div>
            <div class="bg-black/40 p-4 rounded-xl border border-white/10 min-h-[60px] flex items-center justify-center">
                <p id="texto-capturado" class="text-blue-100 italic text-sm">"Inicie a leitura..."</p>
            </div>
        </div>

        <button id="btn-acao" onclick="gerenciarRodada()" 
            class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95">
            Começar Gincana
        </button>
    </div>

    <script>
        // Configurações Supabase
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        const livros = ["gn", "ex", "lv", "nm", "dt", "js", "jz", "rt", "1sm", "2sm", "1rs", "2rs", "1cr", "2cr", "ed", "ne", "et", "jo", "sl", "pv", "ec", "ct", "is", "jr", "lm", "ez", "dn", "os", "jl", "am", "ob", "mq", "na", "hc", "sf", "ag", "zc", "ml", "mt", "mc", "lc", "jo", "at", "rm", "1co", "2co", "gl", "ef", "fp", "cl", "1ts", "2ts", "1tm", "2tm", "tt", "fm", "hb", "tg", "1pe", "2pe", "1jo", "2jo", "3jo", "jd", "ap"];
        
        let rodada = 0;
        let pontosAcumulados = 0;
        let tempoRestante = 60;
        let timerInterval;
        let textoOficial = "";
        let validado = false;
        let recognition;

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;
        }

        async function gerenciarRodada() {
            if (rodada >= 10) return;
            
            const btn = document.getElementById('btn-acao');
            
            // Início do Sorteio
            if (btn.innerText === "COMEÇAR GINCANA" || btn.innerText === "PRÓXIMA RODADA") {
                await iniciarSorteio();
            } else if (btn.innerText === "ENCONTREI!") {
                ativarVoz();
            }
        }

        async function iniciarSorteio() {
            rodada++;
            document.getElementById('rodada-atual').innerText = rodada;
            const btn = document.getElementById('btn-acao');
            btn.disabled = true;
            btn.innerText = "SORTEANDO...";

            try {
                const livroSorteado = livros[Math.floor(Math.random() * livros.length)];
                const response = await fetch(`https://raw.githubusercontent.com/thiagobodruk/biblia/master/json/pt_almeida.json`);
                const biblia = await response.json();

                const livroData = biblia.find(l => l.abbrev === livroSorteado);
                const capIdx = Math.floor(Math.random() * livroData.chapters.length);
                const verIdx = Math.floor(Math.random() * livroData.chapters[capIdx].length);
                
                textoOficial = livroData.chapters[capIdx][verIdx];
                document.getElementById('endereco').innerText = `${livroData.name} ${capIdx + 1}:${verIdx + 1}`;
                
                // Reset Timer
                tempoRestante = 60;
                iniciarTimer();

                btn.disabled = false;
                btn.innerText = "ENCONTREI!";
                btn.classList.replace('bg-yellow-500', 'bg-green-500');
                btn.classList.add('text-white');
            } catch (e) {
                alert("Erro ao buscar versículo.");
                btn.disabled = false;
            }
        }

        function iniciarTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-display').innerText = tempoRestante;
            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer-display').innerText = tempoRestante;
                if (tempoRestante <= 10) document.getElementById('timer-display').classList.add('text-red-500');
                if (tempoRestante <= 0) finalizarRodada(false);
            }, 1000);
        }

        function ativarVoz() {
            document.getElementById('ia-area').classList.remove('hidden');
            document.getElementById('btn-acao').innerText = "ESCUCHANDO...";
            document.getElementById('btn-acao').disabled = true;
            recognition.start();

            recognition.onresult = (event) => {
                let transcricao = Array.from(event.results).map(r => r[0].transcript).join('');
                document.getElementById('texto-capturado').innerText = `"${transcricao}"`;
                
                if (validarTexto(transcricao)) {
                    finalizarRodada(true);
                }
            };
        }

        function validarTexto(falado) {
            const limpar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '');
            return limpar(falado).includes(limpar(textoOficial).substring(0, 15));
        }

        async function finalizarRodada(sucesso) {
            clearInterval(timerInterval);
            recognition.stop();
            document.getElementById('ia-area').classList.add('hidden');
            
            if (sucesso) {
                pontosAcumulados += tempoRestante;
                document.getElementById('pontos-totais').innerText = pontosAcumulados;
                alert(`Boa! Ganhou ${tempoRestante} pontos.`);
            } else {
                alert("Tempo esgotado ou leitura incorreta.");
            }

            const btn = document.getElementById('btn-acao');
            btn.disabled = false;
            btn.classList.replace('bg-green-500', 'bg-yellow-500');
            btn.classList.remove('text-white');

            if (rodada < 10) {
                btn.innerText = "PRÓXIMA RODADA";
            } else {
                btn.innerText = "FINALIZAR JOGADA";
                btn.onclick = enviarPontuacao;
            }
        }

        async function enviarPontuacao() {
            const userId = (await supabaseClient.auth.getUser()).data.user.id;
            const { error } = await supabaseClient
                .from('ranking')
                .insert([{ perfil_id: userId, pontuacao: pontosAcumulados }]);

            if (!error) {
                alert(`Desafio Concluído! Total: ${pontosAcumulados} pontos.`);
                window.location.href = 'ranking.html';
            }
        }

        window.onload = () => {
            document.getElementById('nome-usuario').innerText = localStorage.getItem('usuario_nome') || "Guerreiro";
        };
    </script>
</body>
</html>
