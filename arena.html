<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-family: sans-serif;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.96);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-4">

    <!-- Cabeçalho -->
    <div class="w-full max-w-2xl flex justify-between items-center mb-4 mt-2 px-2">
        <div class="flex flex-col">
            <span id="nome-usuario" class="text-yellow-400 font-black text-lg uppercase italic">Guerreiro</span>
            <span class="text-blue-200 text-[10px] uppercase tracking-widest">Rodada: <span id="rodada-atual">0</span>/10</span>
        </div>
        <div class="text-right">
            <span class="block text-[10px] uppercase text-blue-300">Pontos</span>
            <span id="pontos-totais" class="text-2xl font-black text-white">0</span>
        </div>
    </div>

    <div id="arena-box" class="glass-panel w-full max-w-2xl p-6 rounded-3xl text-center shadow-2xl">
        <div id="timer-display" class="text-5xl font-black text-yellow-500 mb-4">60</div>

        <div id="display-sorteio">
            <h2 id="endereco" class="text-4xl md:text-5xl font-black text-white mb-2 uppercase tracking-tighter">---</h2>
            <p id="instrucao" class="text-blue-200 text-[10px] mb-6 uppercase tracking-widest italic">Aguardando início</p>
        </div>

        <div id="ia-area" class="hidden mb-6">
            <div id="indicador-voz" class="inline-block mb-3 text-[10px] bg-red-600 px-3 py-1 rounded-full font-bold uppercase pulse-red">Escutando...</div>
            <div class="bg-black/40 p-4 rounded-xl border border-white/10 min-h-[60px] flex items-center justify-center">
                <p id="texto-capturado" class="text-blue-100 italic text-sm">"Inicie a leitura..."</p>
            </div>
        </div>

        <button id="btn-acao" onclick="gerenciarRodada()" 
            class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95">
            Começar Gincana
        </button>
    </div>

    <!-- Script de Dados (Contornando CORS) -->
    <script src="https://thiagobodruk.github.io/biblia/json/pt_almeida.js"></script>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let rodada = 0, pontosAcumulados = 0, tempoRestante = 60, timerInterval, textoOficial = "";
        let recognition;

        // Configuração Robusta da Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = true;
            recognition.continuous = true;
        }

        async function gerenciarRodada() {
            const btn = document.getElementById('btn-acao');
            
            if (btn.innerText === "COMEÇAR GINCANA" || btn.innerText === "PRÓXIMA RODADA") {
                iniciarSorteio();
            } else if (btn.innerText === "ENCONTREI!") {
                ativarVoz();
            }
        }

        function iniciarSorteio() {
            try {
                rodada++;
                document.getElementById('rodada-atual').innerText = rodada;
                
                // Usando a variável global carregada pelo script externo
                const biblia = biblia_pt_almeida; 
                const livroSorteado = biblia[Math.floor(Math.random() * biblia.length)];
                const capIdx = Math.floor(Math.random() * livroSorteado.chapters.length);
                const verIdx = Math.floor(Math.random() * livroSorteado.chapters[capIdx].length);
                
                textoOficial = livroSorteado.chapters[capIdx][verIdx];
                document.getElementById('endereco').innerText = `${livroSorteado.name} ${capIdx + 1}:${verIdx + 1}`;
                
                tempoRestante = 60;
                iniciarTimer();

                const btn = document.getElementById('btn-acao');
                btn.innerText = "ENCONTREI!";
                btn.classList.replace('bg-yellow-500', 'bg-green-500');
                btn.classList.add('text-white');
            } catch (e) {
                console.error(e);
                alert("Erro ao acessar a base bíblica local.");
            }
        }

        function iniciarTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                tempoRestante--;
                document.getElementById('timer-display').innerText = tempoRestante;
                if (tempoRestante <= 0) finalizarRodada(false);
            }, 1000);
        }

        function ativarVoz() {
            if (!recognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }
            
            document.getElementById('ia-area').classList.remove('hidden');
            document.getElementById('btn-acao').innerText = "ESCUCHANDO...";
            document.getElementById('btn-acao').disabled = true;
            
            recognition.start();

            recognition.onresult = (event) => {
                const transcricao = Array.from(event.results).map(r => r[0].transcript).join('');
                document.getElementById('texto-capturado').innerText = `"${transcricao}"`;
                
                // Validação: se o que foi falado contém parte do texto oficial
                const limpar = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '');
                if (limpar(transcricao).includes(limpar(textoOficial).substring(0, 10))) {
                    finalizarRodada(true);
                }
            };

            recognition.onerror = (e) => {
                console.error("Erro voz:", e.error);
                if(e.error === 'not-allowed') alert("Por favor, permita o uso do microfone nas configurações do navegador.");
            };
        }

        async function finalizarRodada(sucesso) {
            clearInterval(timerInterval);
            if(recognition) recognition.stop();
            document.getElementById('ia-area').classList.add('hidden');
            
            if (sucesso) {
                pontosAcumulados += tempoRestante;
                document.getElementById('pontos-totais').innerText = pontosAcumulados;
            }

            const btn = document.getElementById('btn-acao');
            btn.disabled = false;
            btn.classList.replace('bg-green-500', 'bg-yellow-500');
            btn.classList.remove('text-white');

            if (rodada < 10) {
                btn.innerText = "PRÓXIMA RODADA";
            } else {
                btn.innerText = "FINALIZAR JOGADA";
                btn.onclick = enviarPontuacao;
            }
        }

        async function enviarPontuacao() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                const { error } = await supabaseClient
                    .from('ranking')
                    .insert([{ perfil_id: user.id, pontuacao: pontosAcumulados }]);
                
                if (!error) window.location.href = 'ranking.html';
                else alert("Erro ao salvar pontos.");
            }
        }

        window.onload = () => {
            document.getElementById('nome-usuario').innerText = localStorage.getItem('usuario_nome') || "Guerreiro";
        };
    </script>
</body>
</html>
