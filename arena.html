<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.96);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body class="p-4">

    <!-- Cabeçalho da Arena -->
    <div class="w-full max-w-4xl flex justify-between items-center mb-6 mt-4">
        <div class="flex flex-col">
            <span class="text-yellow-400 font-black text-xl uppercase tracking-tighter">Arena</span>
            <span id="nome-usuario" class="text-blue-200 text-xs uppercase tracking-widest">Carregando...</span>
        </div>
        <button onclick="logout()" class="text-[10px] border border-red-500/50 text-red-400 px-3 py-1 rounded-lg hover:bg-red-500/20 uppercase font-bold">Sair</button>
    </div>

    <!-- Painel Central do Versículo -->
    <div class="glass-panel w-full max-w-2xl p-8 md:p-12 rounded-3xl text-center flex flex-col items-center justify-center min-h-[400px]">
        
        <div id="loading-bible" class="animate-pulse text-yellow-500 font-bold mb-4">DESEMBAINHANDO A ESPADA...</div>
        
        <h2 id="texto-biblico" class="text-xl md:text-2xl font-serif italic mb-8 leading-relaxed text-blue-50">
            <!-- Texto aparecerá aqui -->
        </h2>
        
        <div id="referencia" class="text-yellow-400 font-black text-lg uppercase tracking-widest bg-yellow-400/10 px-6 py-2 rounded-full border border-yellow-400/30">
            <!-- Referência aparecerá aqui -->
        </div>

        <button onclick="sortearNovoVersiculo()" class="mt-12 bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-4 px-8 rounded-xl transition-all active:scale-95 shadow-lg uppercase text-sm">
            Próximo Versículo
        </button>
    </div>

    <script>
        // Lista de segurança (Fallback) caso a API falhe
        const versiculosReserva = [
            { text: "Lâmpada para os meus pés é tua palavra e luz, para o meu caminho.", ref: "Salmos 119:105" },
            { text: "Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito...", ref: "João 3:16" },
            { text: "O Senhor é o meu pastor, nada me faltará.", ref: "Salmos 23:1" },
            { text: "Tudo posso naquele que me fortalece.", ref: "Filipenses 4:13" }
        ];

        async function buscarVersiculo() {
            const displayTexto = document.getElementById('texto-biblico');
            const displayRef = document.getElementById('referencia');
            const loading = document.getElementById('loading-bible');

            loading.style.display = 'block';
            displayTexto.innerText = "";
            displayRef.innerText = "";

            try {
                // Usando uma API pública que não exige Token e suporta Português
                const response = await fetch('https://proword-api.vercel.app/api/bible/random');
                
                if (!response.ok) throw new Error("Erro na API");

                const data = await response.json();
                displayTexto.innerText = `"${data.text}"`;
                displayRef.innerText = data.reference;

            } catch (error) {
                console.warn("API indisponível, usando reserva local.");
                const sorteado = versiculosReserva[Math.floor(Math.random() * versiculosReserva.length)];
                displayTexto.innerText = `"${sorteado.text}"`;
                displayRef.innerText = sorteado.ref;
            } finally {
                loading.style.display = 'none';
            }
        }

        function sortearNovoVersiculo() {
            buscarVersiculo();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Inicialização
        window.onload = () => {
            // Recupera o nome do usuário salvo no login
            const nome = localStorage.getItem('usuario_nome') || "Guerreiro";
            document.getElementById('nome-usuario').innerText = nome;
            buscarVersiculo();
        };
    </script>
</body>
</html>
