<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: url('imagens/fundo_jogo.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: white;
        }
        .glass-panel {
            background: rgba(0, 31, 63, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #FFD700;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- Header com Identificação -->
    <div class="absolute top-4 w-full px-6 flex justify-between items-center text-xs uppercase tracking-widest">
        <div id="user-info" class="text-yellow-400 font-bold">Carregando...</div>
        <button onclick="logout()" class="bg-red-600 px-3 py-1 rounded font-bold">Sair</button>
    </div>

    <main id="game-container" class="glass-panel w-full max-w-lg p-8 rounded-3xl shadow-2xl text-center">
        <div id="status-game" class="mb-4 text-sm font-bold text-blue-200">RODADA 1 / 10</div>
        
        <div id="instrucao" class="text-2xl mb-6 h-24 flex items-center justify-center font-black uppercase text-white">
            Aguardando Início...
        </div>

        <div id="endereco" class="text-4xl font-black text-yellow-400 mb-6 hidden"></div>
        <div id="timer" class="text-6xl font-black mb-8 text-white hidden">60</div>
        <div id="transcricao" class="text-xs text-gray-400 italic min-h-[40px] mb-4"></div>

        <button id="btn-acao" onclick="iniciarRodada()" class="w-full bg-yellow-500 text-blue-900 font-black py-4 rounded-xl text-xl hover:scale-105 transition-all shadow-lg">
            DESEMBAINHAR ESPADA!
        </button>
    </main>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const BIBLIA_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdHIiOiJTdW4gTWF5IDEwIDIwMjYgMTQ6MjM6MzggR01UKzAwMDAudGh1cnVnb0BnbWFpbC5jb20iLCJpYXQiOjE3Nzg0MjMwMTh9.3_Bya9bi4SKO9oEfFQVNck7ZeINtKiQjmgxJS9CTrTEI"; // Use o token gerado anteriormente
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let userSession = null;
        let rodadaAtual = 1;
        let pontuacaoTotal = 0;
        let versiculoCerto = "";
        let tempoRestante = 60;
        let cronometro;

        // 1. Verificar Sessão ao Carregar
        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                userSession = session.user;
                // Buscar nome do perfil
                const { data } = await supabaseClient.from('perfis').select('nome').eq('id', userSession.id).single();
                document.getElementById('user-info').innerText = data ? `Jogador: ${data.nome}` : `Jogador: ${userSession.email}`;
            }
        };

        // 2. Lógica do Jogo
        async function iniciarRodada() {
            document.getElementById('btn-acao').classList.add('hidden');
            const instrucao = document.getElementById('instrucao');
            
            // Contagem Regressiva 1, 2, 3
            for(let i=1; i<=3; i++) {
                instrucao.innerText = i;
                await new Promise(r => setTimeout(r, 1000));
            }

            instrucao.innerText = "Buscando Versículo...";
            
            try {
                const res = await fetch('https://www.abibliadigital.com.br/api/verses/nvi/random', {
                    headers: { 'Authorization': `Bearer ${BIBLIA_TOKEN}` }
                });
                const data = await res.json();
                versiculoCerto = data.text;
                
                const enderecoEl = document.getElementById('endereco');
                enderecoEl.innerText = `${data.book.name} ${data.chapter}:${data.number}`;
                enderecoEl.classList.remove('hidden');
                instrucao.innerText = "O endereço é:";

                await new Promise(r => setTimeout(r, 5000));
                
                instrucao.innerText = "CARREGAR!";
                enderecoEl.classList.add('hidden');
                document.getElementById('timer').classList.remove('hidden');
                começarCronometro();
            } catch (e) {
                alert("Erro ao conectar com a Bíblia Digital.");
                resetBotao();
            }
        }

        function começarCronometro() {
            tempoRestante = 60;
            const timerEl = document.getElementById('timer');
            cronometro = setInterval(() => {
                tempoRestante--;
                timerEl.innerText = tempoRestante;
                if(tempoRestante <= 0) finalizarRodada(0);
            }, 1000);
            // Aqui você deve ativar a Web Speech API para ouvir "Encontrei"
        }

        async function finalizarRodada(pontos) {
            clearInterval(cronometro);
            pontuacaoTotal += pontos;
            
            if(rodadaAtual < 10) {
                rodadaAtual++;
                document.getElementById('status-game').innerText = `RODADA ${rodadaAtual} / 10`;
                resetBotao("PRÓXIMA RODADA");
            } else {
                await salvarPontuacao();
            }
        }

        async function salvarPontuacao() {
            document.getElementById('instrucao').innerText = "Salvando Resultado...";
            const { error } = await supabaseClient
                .from('ranking')
                .insert([{ jogador_id: userSession.id, pontos: pontuacaoTotal }]);

            if (error) {
                alert("Erro ao salvar pontos: " + error.message);
            } else {
                alert(`Fim de jogo! Pontuação total: ${pontuacaoTotal}`);
                window.location.href = 'ranking.html';
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        function resetBotao(texto = "DESEMBAINHAR ESPADA!") {
            const btn = document.getElementById('btn-acao');
            btn.innerText = texto;
            btn.classList.remove('hidden');
            document.getElementById('timer').classList.add('hidden');
        }
    </script>
</body>
</html>
