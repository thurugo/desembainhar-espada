<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.96);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body class="p-4">

    <div class="w-full max-w-2xl flex justify-between items-center mb-6 mt-4 px-2">
        <div class="flex flex-col">
            <span class="text-yellow-400 font-black text-xl uppercase italic">Arena IA</span>
            <span id="nome-usuario" class="text-blue-200 text-xs uppercase tracking-widest">Carregando...</span>
        </div>
        <div id="status-voz" class="text-[10px] bg-red-500/20 text-red-400 px-3 py-1 rounded-full border border-red-500/30 uppercase font-bold">Microfone OFF</div>
    </div>

    <div class="glass-panel w-full max-w-2xl p-8 rounded-3xl text-center">
        <div id="loading" class="hidden animate-pulse text-yellow-500 font-bold mb-4">BUSCANDO NA ESCRITURA...</div>
        
        <!-- Endereço Sorteado -->
        <h2 id="endereco" class="text-4xl md:text-5xl font-black text-white mb-2 uppercase tracking-tighter">---</h2>
        <p id="instrucao" class="text-blue-200 text-xs mb-8 uppercase tracking-widest">Aguardando Sorteio</p>

        <!-- Área de Validação -->
        <div id="area-leitura" class="hidden">
            <div class="bg-black/30 p-4 rounded-xl mb-6 border border-white/10 min-h-[100px] flex items-center justify-center">
                <p id="transcricao" class="italic text-blue-100 text-sm md:text-base">"Ouvindo sua leitura..."</p>
            </div>
            <div id="resultado-ia" class="font-black text-xl uppercase mb-6"></div>
        </div>

        <button id="btn-acao" onclick="sortearEIniciar()" 
            class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-2xl shadow-lg uppercase text-lg transition-all active:scale-95">
            Sortear Versículo
        </button>
    </div>

    <script>
        let textoOficial = "";
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'pt-BR';
        recognition.interimResults = true;

        async function sortearEIniciar() {
            const btn = document.getElementById('btn-acao');
            const loading = document.getElementById('loading');
            
            btn.disabled = true;
            loading.classList.remove('hidden');

            try {
                // Chamada à API da Bíblia Digital
                const response = await fetch('https://www.abibliadigital.com.br/api/verses/nvi/random');
                const data = await response.json();

                textoOficial = data.text;
                document.getElementById('endereco').innerText = `${data.book.name} ${data.chapter}:${data.number}`;
                document.getElementById('instrucao').innerText = "Encontre e leia agora!";
                
                // Prepara interface para voz
                document.getElementById('area-leitura').classList.remove('hidden');
                btn.innerText = "OUVINDO...";
                btn.classList.replace('bg-yellow-500', 'bg-red-500');
                btn.classList.replace('text-blue-900', 'text-white');
                
                iniciarIAVoz();
            } catch (error) {
                alert("Erro ao conectar com a Bíblia Digital.");
                btn.disabled = false;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function iniciarIAVoz() {
            document.getElementById('status-voz').innerText = "Microfone ON";
            document.getElementById('status-voz').classList.replace('text-red-400', 'text-green-400');
            
            recognition.start();

            recognition.onresult = (event) => {
                const transcricao = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                
                document.getElementById('transcricao').innerText = `"${transcricao}"`;
                validarLeitura(transcricao);
            };

            recognition.onend = () => {
                document.getElementById('status-voz').innerText = "Microfone OFF";
                document.getElementById('status-voz').classList.replace('text-green-400', 'text-red-400');
            };
        }

        function validarLeitura(falado) {
            const original = textoOficial.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"");
            const usuario = falado.toLowerCase();
            const resultadoDiv = document.getElementById('resultado-ia');

            // Verifica se as palavras principais estão presentes
            if (usuario.length > (original.length * 0.7)) {
                resultadoDiv.innerText = "Leitura Validada! ✅";
                resultadoDiv.classList.add('text-green-400');
                pararJogoSucesso();
            }
        }

        function pararJogoSucesso() {
            recognition.stop();
            const btn = document.getElementById('btn-acao');
            btn.innerText = "NOVO DESAFIO";
            btn.disabled = false;
            btn.classList.replace('bg-red-500', 'bg-yellow-500');
            btn.classList.replace('text-white', 'text-blue-900');
        }

        window.onload = () => {
            document.getElementById('nome-usuario').innerText = localStorage.getItem('usuario_nome') || "Guerreiro";
        };
    </script>
</body>
</html>
