<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Desembainhar Espada</title>
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
    body {
        margin: 0;
        padding: 4px;
        min-height: 100vh;
        display: flex; 
        flex-direction: column; 
        align-items: center;
        color: white; 
        font-family: sans-serif;
        position: relative;
    }

    /* Camada de fundo corrigida: fixa no topo e centralizada na horizontal */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* AJUSTE AQUI: Mudado de 'center center' para 'center top' */
        background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
        background-size: cover; 
        z-index: -1;
    }

    .glass-panel {
        background: rgba(0, 20, 40, 0.5); 
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }
    .pulse-red { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    select { background: rgba(0, 20, 40, 0.8); border: 1px solid rgba(255, 215, 0, 0.3); color: white; }
    option { background: #001428; color: white; }

    /* Efeito de contorno para a página de instruções (pode deixar em todas) */
    .text-contour {
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000,
             0px  4px 10px rgba(0,0,0,0.9);
    }
</style>
</head>
<body class="p-4">

    <div id="login-container" class="glass-panel w-full max-w-md p-8 md:p-12 rounded-3xl text-center text-white">
        
        <div class="mb-8">
            <h2 class="text-3xl font-black text-yellow-400 uppercase tracking-tighter shadow-sm">Entrar na Arena</h2>
            <p class="text-blue-200 text-xs mt-1 italic uppercase tracking-widest">Prepare sua Espada</p>
        </div>

        <div class="space-y-5">
            <!-- E-mail -->
            <div class="flex flex-col text-left">
                <label class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200 tracking-widest">E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com" 
                    class="w-full p-4 rounded-xl transition-all">
            </div>
            
            <!-- Senha -->
            <div class="flex flex-col text-left">
                <label class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200 tracking-widest">Senha</label>
                <input type="password" id="login-senha" placeholder="Sua senha secreta" 
                    class="w-full p-4 rounded-xl transition-all">
            </div>

            <!-- Botão de Acesso -->
            <button onclick="executarLogin()" id="btn-login"
                class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-xl transition-all active:scale-95 shadow-lg uppercase mt-2 text-lg">
                Acessar Jogo
            </button>
        </div>

        <!-- Link para Cadastro -->
        <div class="mt-10 pt-6 border-t border-white/10">
            <p class="text-blue-200 text-xs mb-2">Ainda não tem conta?</p>
            <a href="cadastro.html" class="text-sm text-yellow-400 hover:text-yellow-300 underline uppercase font-black tracking-tight">
                Criar conta agora
            </a>
        </div>
    </div>

    <script>
        // 1. Configuração Global
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function executarLogin() {
            const btn = document.getElementById('btn-login');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-senha').value;

            if (!email || !password) {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "VERIFICANDO...";

            try {
                // PASSO 1: Autenticação no Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                if (data.user) {
                    // PASSO 2: Buscar o nome e organização na tabela 'perfis'
                    const { data: perfil, error: pError } = await supabaseClient
                        .from('perfis')
                        .select('nome, organizacao')
                        .eq('id', data.user.id)
                        .single();

                    if (pError) {
                        console.warn("Perfil não encontrado, usando nome genérico.");
                    }

                    // PASSO 3: Salvar dados no navegador para a Arena usar
                    localStorage.setItem('usuario_nome', perfil ? perfil.nome : "Guerreiro");
                    localStorage.setItem('usuario_org', perfil ? perfil.organizacao : "ER");
                    
                    // PASSO 4: Redirecionar para a Arena
                    window.location.href = 'arena.html';
                }

            } catch (err) {
                console.error("Erro no login:", err);
                alert("Erro ao entrar: Verifique se o e-mail e a senha estão corretos ou se o e-mail foi confirmado.");
                btn.disabled = false;
                btn.innerText = "ACESSAR JOGO";
            }
        }
    </script>
</body>
</html>
