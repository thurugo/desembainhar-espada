<div class="glass-panel p-8 rounded-2xl shadow-xl text-white w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-yellow-400">Entrar na Arena</h2>
    <form id="login-form" class="space-y-4">
        <input type="email" id="log-email" placeholder="E-mail" class="w-full p-3 rounded-lg bg-white/20 border border-white/30 outline-none focus:border-yellow-400" required>
        <input type="password" id="log-senha" placeholder="Senha" class="w-full p-3 rounded-lg bg-white/20 border border-white/30 outline-none focus:border-yellow-400" required>
        <button type="submit" class="w-full bg-yellow-500 text-blue-900 font-bold py-3 rounded-lg hover:bg-yellow-400 transition-all">
            ENTRAR AGORA
        </button>
    </form>
    <p class="mt-4 text-sm text-center">Não tem conta? <a href="cadastro.html" class="text-yellow-400 underline">Cadastre-se</a></p>
</div>

<script>
    const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
    const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('log-email').value;
        const password = document.getElementById('log-senha').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            alert("Erro ao entrar: " + error.message + " (Verifique se confirmou o e-mail)");
        } else {
            window.location.href = 'arena.html';
        }
    });
</script>
