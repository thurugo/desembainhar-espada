<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body {
        background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* Painel idêntico ao de cadastro para manter o padrão */
    .glass-panel {
        background: rgba(0, 20, 40, 0.96);
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }
    input { font-size: 16px !important; color: white !important; }
</style>
</head>
<body class="p-4">
    <div id="login-container" class="glass-panel w-full max-w-md p-8 md:p-12 rounded-3xl text-center text-white">
        <h2 class="text-3xl font-black text-yellow-400 uppercase mb-6 shadow-sm">Entrar na Arena</h2>
        
        <div class="space-y-5">
            <div class="flex flex-col text-left">
                <label class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200">E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com" 
                    class="p-4 rounded-xl bg-white/10 border border-white/20 outline-none focus:border-yellow-400">
            </div>
            
            <div class="flex flex-col text-left">
                <label class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200">Senha</label>
                <input type="password" id="login-senha" placeholder="Sua senha" 
                    class="p-4 rounded-xl bg-white/10 border border-white/20 outline-none focus:border-yellow-400">
            </div>

            <button onclick="executarLogin()" id="btn-login"
                class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-4 rounded-xl transition-all shadow-lg uppercase mt-2">
                Acessar Jogo
            </button>
        </div>

        <div class="mt-8 pt-6 border-t border-white/10">
            <a href="cadastro.html" class="text-xs text-blue-200 hover:text-yellow-400 underline uppercase font-bold">Criar uma nova conta</a>
        </div>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            const email = document.getElementById('log-email').value;
            const password = document.getElementById('log-senha').value;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                if (data.user) {
                    // Login bem sucedido, redireciona para a arena
                    window.location.href = 'arena.html';
                }
            } catch (err) {
    console.error(err); // Isso ajuda a ver o erro técnico no F12
    if (err.message === "Email not confirmed") {
        alert("O e-mail ainda não foi confirmado. Verifique sua caixa de entrada.");
    } else {
        alert("Erro ao entrar: Usuário ou senha incorretos.");
    }
    btn.innerText = "ACESSAR JOGO";
    btn.disabled = false;
}
        });
    </script>
</body>
</html>
