<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escolha do Módulo - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; padding: 4px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-family: sans-serif; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
            background-size: cover; z-index: -1;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
        .text-contour { text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, -1px 1px 0 #000; }
    </style>
</head>
<body class="p-4">

    <div class="glass-panel w-full max-w-md p-6 rounded-3xl text-center shadow-2xl">
        <div class="mb-6">
            <h1 class="text-2xl font-black text-yellow-400 uppercase tracking-tighter italic text-contour">Selecione o Módulo</h1>
            <p class="text-blue-200 text-[10px] uppercase tracking-widest mt-1">Escolha seu desafio na Arena</p>
        </div>

        <div class="space-y-4">
            <button onclick="jogar('regular')" class="block w-full bg-blue-900/60 hover:bg-blue-800 text-left p-4 rounded-2xl border border-blue-500/30 transition-all active:scale-95">
                <div class="text-yellow-400 font-black uppercase text-sm">⚔️ Esgrima Bíblico Tradicional</div>
                <div class="text-blue-200 text-[11px] mt-1">Encontre o livro, capítulo e versículo sorteados na tela.</div>
            </button>

            <button onclick="jogar('avancado')" class="block w-full bg-purple-900/60 hover:bg-purple-800 text-left p-4 rounded-2xl border border-purple-500/30 transition-all active:scale-95">
                <div class="text-yellow-400 font-black uppercase text-sm">🔥 Esgrima Bíblico Avançado</div>
                <div class="text-purple-200 text-[11px] mt-1">Encontre qualquer versículo que contenha a palavra-chave sorteada!</div>
            </button>

            <button onclick="jogar('gerais_biblia')" class="block w-full bg-emerald-900/60 hover:bg-emerald-800 text-left p-4 rounded-2xl border border-emerald-500/30 transition-all active:scale-95">
                <div class="text-yellow-400 font-black uppercase text-sm">📚 Conhecimentos Gerais da Bíblia</div>
                <div class="text-emerald-200 text-[11px] mt-1">Maratona de 1.000 perguntas em níveis fácil, médio e difícil. Teste seu domínio!</div>
            </button>
        </div>

        <div class="mt-6">
            <a href="ranking.html" class="text-xs text-yellow-500 hover:underline block mb-2">🏆 Ver Rankings</a>
            <a href="index.html" class="text-xs text-blue-300 hover:underline">Sair da Conta</a>
        </div>
    </div>

    <script>
        function jugar(modulo) {
            // Salva a escolha temporariamente para a arena saber o que carregar
            localStorage.setItem('modulo_atual', modulo);
            
            if (modulo === 'regular') {
                window.location.href = 'arena.html';
            } else if (modulo === 'avancado') {
                window.location.href = 'arena_avancada.html';
            } else if (modulo === 'gerais_biblia') {
                window.location.href = 'gerais_biblia.html';
            }
        }
    </script>
</body>
</html>
