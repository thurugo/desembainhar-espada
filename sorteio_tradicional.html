<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorteador - Esgrima Tradicional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; padding: 4px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-family: sans-serif; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
            background-size: cover; z-index: -1;
        }
        .glass-panel {
            background: rgba(0, 15, 30, 0.75);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
        .text-contour {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        select { background: rgba(0, 20, 40, 0.85); border: 1px solid rgba(255, 215, 0, 0.3); color: white; }
        option { background: #001428; color: white; }
    </style>
</head>
<body class="p-4">

    <div class="glass-panel w-full max-w-xl p-6 rounded-3xl text-center shadow-2xl">
        
        <div class="mb-4">
            <span class="bg-blue-600/30 text-blue-300 border border-blue-500/30 text-[10px] uppercase font-black px-3 py-1 rounded-full tracking-widest inline-block mb-2">
                Modo Presencial / Dinâmica
            </span>
            <h1 class="text-2xl font-black text-yellow-400 uppercase italic text-contour">⚔️ Esgrima Tradicional</h1>
            <p class="text-blue-200 text-xs mt-1">Sorteador de Endereços Bíblicos</p>
        </div>

        <!-- Seletor de Versão (Padrão NVI) -->
        <div class="mb-6 max-w-xs mx-auto">
            <select id="versao-biblia" onchange="carregarBiblia()" class="w-full p-2.5 rounded-xl text-xs font-bold outline-none text-center">
                <option value="NVI.json" selected>NVI - Nova Versão Internacional</option>
                <option value="ACF.json">ACF - Almeida Corrigida e Fiel</option>
                <option value="ARA.json">ARA - Almeida Revista e Atualizada</option>
                <option value="ARC.json">ARC - Almeida Revista e Corrigida</option>
                <option value="NTLH.json">NTLH - Nova Trad. na Linguagem de Hoje</option>
            </select>
        </div>

        <!-- Painel de Exibição do Sorteio -->
        <div class="bg-black/50 border border-white/10 rounded-2xl p-6 mb-6 min-h-[180px] flex flex-col items-center justify-center">
            <span id="status-carga" class="text-xs text-yellow-400 animate-pulse uppercase font-bold">Carregando Bíblia...</span>
            
            <div id="resultado-area" class="hidden w-full">
                <span class="text-[10px] uppercase tracking-widest text-gray-400 block mb-1">Desembainhar em:</span>
                <div id="endereco-sorteado" class="text-3xl md:text-4xl font-black text-yellow-400 uppercase tracking-tight text-contour mb-4">
                    ---
                </div>

                <!-- Botão para revelar texto para conferência do líder -->
                <button id="btn-revelar" onclick="alternarTexto()" class="text-[11px] bg-white/10 hover:bg-white/20 text-blue-200 px-4 py-1.5 rounded-full font-bold uppercase transition-all">
                    👁️ Mostrar Texto para Conferência
                </button>

                <div id="caixa-texto" class="hidden mt-4 p-4 bg-blue-950/60 border border-blue-500/30 rounded-xl text-sm text-gray-200 italic leading-relaxed text-left">
                    "Texto do versículo aqui..."
                </div>
            </div>
        </div>

        <!-- Botão Principal -->
        <button id="btn-sortear" onclick="sortearVersiculo()" disabled
            class="w-full bg-yellow-500 hover:bg-yellow-400 disabled:bg-gray-600 text-blue-950 font-black py-5 rounded-2xl shadow-xl uppercase text-lg transition-all active:scale-95 mb-4">
            🎲 Sortear Endereço
        </button>

        <div class="flex justify-between items-center text-xs text-gray-400 px-2">
            <span>Sorteios realizados: <strong id="contador" class="text-white">0</strong></span>
            <a href="index.html" class="text-blue-300 hover:underline">Voltar ao Início</a>
        </div>
    </div>

    <script>
        let bibliaData = [];
        let sorteios = 0;
        let textoAtual = "";

        window.onload = () => {
            carregarBiblia();
        };

        async function carregarBiblia() {
            const versao = document.getElementById('versao-biblia').value;
            const status = document.getElementById('status-carga');
            const btn = document.getElementById('btn-sortear');
            
            status.classList.remove('hidden');
            status.innerText = "Carregando pergaminhos...";
            document.getElementById('resultado-area').classList.add('hidden');
            btn.disabled = true;

            try {
                // Tenta buscar na pasta ./biblias/ (padrão do seu projeto)
                let response = await fetch(`./biblias/${versao}`);
                if (!response.ok) {
                    // Fallback caso esteja na raiz
                    response = await fetch(`./${versao}`);
                }
                if (!response.ok) throw new Error("Arquivo não encontrado.");

                bibliaData = await response.json();
                status.classList.add('hidden');
                btn.disabled = false;
                sortearVersiculo(); // Já faz um primeiro sorteio ao abrir
            } catch (e) {
                console.error(e);
                status.innerText = `Erro ao carregar ${versao}. Verifique a pasta /biblias.`;
                status.className = "text-xs text-red-400 font-bold";
            }
        }

        function sortearVersiculo() {
            if (!bibliaData || bibliaData.length === 0) return;

            // Escolhe livro aleatório
            const livroIdx = Math.floor(Math.random() * bibliaData.length);
            const livro = bibliaData[livroIdx];

            // Escolhe capítulo aleatório
            const capIdx = Math.floor(Math.random() * livro.chapters.length);
            const capitulo = livro.chapters[capIdx];

            // Escolhe versículo aleatório
            const verIdx = Math.floor(Math.random() * capitulo.length);
            textoAtual = capitulo[verIdx];

            // Atualiza a interface
            document.getElementById('resultado-area').classList.remove('hidden');
            document.getElementById('endereco-sorteado').innerText = `${livro.name} ${capIdx + 1}:${verIdx + 1}`;
            
            // Esconde o texto do versículo anterior
            const caixaTexto = document.getElementById('caixa-texto');
            caixaTexto.classList.add('hidden');
            caixaTexto.innerText = `"${textoAtual}"`;
            document.getElementById('btn-revelar').innerText = "👁️ Mostrar Texto para Conferência";

            sorteios++;
            document.getElementById('contador').innerText = sorteios;
        }

        function alternarTexto() {
            const caixa = document.getElementById('caixa-texto');
            const btn = document.getElementById('btn-revelar');
            if (caixa.classList.contains('hidden')) {
                caixa.classList.remove('hidden');
                btn.innerText = "🙈 Ocultar Texto";
            } else {
                caixa.classList.add('hidden');
                btn.innerText = "👁️ Mostrar Texto para Conferência";
            }
        }
    </script>
</body>
</html>
