<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: url('imagens/fundo_entrada.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-family: sans-serif;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.96);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        .podium-1 { border: 2px solid #fbbf24; background: rgba(251, 191, 36, 0.1); }
    </style>
</head>
<body class="p-4">

    <!-- Cabeçalho -->
    <div class="w-full max-w-2xl text-center mb-8 mt-6">
        <h1 class="text-4xl font-black text-yellow-400 uppercase tracking-tighter italic">Galeria de Honra</h1>
        <p class="text-blue-200 text-xs uppercase tracking-[0.3em] mt-2">Os mais velozes na palavra</p>
    </div>

    <!-- Tabela de Ranking -->
    <div class="glass-panel w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl mb-8">
        <table class="w-full text-left border-collapse">
            <thead class="bg-yellow-500 text-blue-900 uppercase font-black text-xs">
                <tr>
                    <th class="p-4">Pos</th>
                    <th class="p-4">Guerreiro(a)</th>
                    <th class="p-4">Org</th>
                    <th class="p-4 text-right">Pontos</th>
                </tr>
            </thead>
            <tbody id="lista-ranking">
                <!-- Linhas inseridas pelo JavaScript -->
                <tr>
                    <td colspan="4" class="p-10 text-center animate-pulse text-blue-200 uppercase text-xs">Carregando classificação...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Botões de Navegação -->
    <div class="flex space-x-4">
        <a href="arena.html" class="bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-4 px-8 rounded-xl uppercase shadow-lg transition-all active:scale-95">
            Voltar à Arena
        </a>
        <button onclick="logout()" class="border border-white/20 hover:bg-white/10 text-white py-4 px-8 rounded-xl uppercase font-bold">
            Sair
        </button>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function carregarRanking() {
            try {
                // Busca o ranking unindo com a tabela de perfis para pegar o nome e organização
                const { data, error } = await supabaseClient
                    .from('ranking')
                    .select(`
                        pontuacao,
                        created_at,
                        perfis (
                            nome,
                            organizacao
                        )
                    `)
                    .order('pontuacao', { ascending: false })
                    .limit(20);

                if (error) throw error;

                const tbody = document.getElementById('lista-ranking');
                tbody.innerHTML = "";

                data.forEach((item, index) => {
                    const isTop = index === 0 ? 'podium-1' : '';
                    const row = `
                        <tr class="border-b border-white/5 ${isTop} transition-colors hover:bg-white/5">
                            <td class="p-4 font-black ${index < 3 ? 'text-yellow-400' : 'text-blue-300'}">${index + 1}º</td>
                            <td class="p-4 font-bold text-sm md:text-base">${item.perfis.nome}</td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded text-[10px] font-black ${item.perfis.organizacao === 'ER' ? 'bg-blue-600 text-white' : 'bg-pink-600 text-white'}">
                                    ${item.perfis.organizacao}
                                </span>
                            </td>
                            <td class="p-4 text-right font-mono font-bold text-yellow-400">${item.pontuacao}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (err) {
                console.error(err);
                document.getElementById('lista-ranking').innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-400">Erro ao carregar dados.</td></tr>`;
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        window.onload = carregarRanking;
    </script>
</body>
</html>
