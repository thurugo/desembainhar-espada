<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    body {
        background: url('imagens/fundo_ranking.png') no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
    }

    /* Ajuste dos Filtros para ficarem em coluna no celular */
    .filter-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
    }

    /* Torna a tabela rolável lateralmente em telas pequenas */
    .table-responsive {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
    }

    table {
        min-width: 400px; /* Garante que os dados não fiquem esmagados */
    }

    /* Melhoria no toque para botões e seletores */
    select, button {
        height: 48px; /* Altura ideal para toque com o dedo */
        font-size: 16px;
    }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Cabeçalho com Filtros -->
        <div class="bg-blue-900 p-6 rounded-t-3xl text-white shadow-xl">
            <h1 class="text-3xl font-black uppercase text-center mb-6 text-yellow-400">Quadro de Honra</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <select id="filtro-org" onchange="carregarRanking()" class="bg-blue-800 border border-blue-700 p-2 rounded-lg outline-none">
                    <option value="todos">Todas Organizações</option>
                    <option value="ER">Embaixadores do Rei</option>
                    <option value="MR">Mensageiras do Rei</option>
                </select>

                <select id="filtro-idade" onchange="carregarRanking()" class="bg-blue-800 border border-blue-700 p-2 rounded-lg outline-none">
                    <option value="todos">Todas as Idades</option>
                    <option value="9-12">9 a 12 anos</option>
                    <option value="13-17">13 a 17 anos</option>
                </select>

                <button onclick="window.location.href='arena.html'" class="bg-yellow-500 text-blue-900 font-bold py-2 rounded-lg hover:bg-yellow-400 transition-all">
                    VOLTAR AO JOGO
                </button>
            </div>
        </div>

        <!-- Tabela de Ranking -->
        <div class="overflow-x-auto shadow-2xl rounded-b-3xl">
            <table class="w-full text-left ranking-table">
                <thead>
                    <tr class="text-blue-900 uppercase text-sm font-black px-4">
                        <th class="p-4">Pos</th>
                        <th class="p-4">Nome</th>
                        <th class="p-4 text-center">Org</th>
                        <th class="p-4 text-center">Pontos</th>
                    </tr>
                </thead>
                <tbody id="ranking-body">
                    <!-- Os dados do Supabase entrarão aqui -->
                    <tr>
                        <td colspan="4" class="text-center p-10 text-gray-500 italic">Carregando pontuações...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function carregarRanking() {
            const org = document.getElementById('filtro-org').value;
            const body = document.getElementById('ranking-body');
            
            // Inicia a query na visualização de ranking que criamos ou direto na tabela
            let query = supabaseClient
                .from('ranking')
                .select(`
                    pontos,
                    perfis (nome, organizacao, data_nascimento)
                `)
                .order('pontos', { ascending: false })
                .limit(10);

            // Aplica filtro de organização se necessário
            if (org !== 'todos') {
                query = query.filter('perfis.organizacao', 'eq', org);
            }

            const { data, error } = await query;

            if (error) {
                body.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-red-500">Erro ao carregar: ${error.message}</td></tr>`;
                return;
            }

            body.innerHTML = "";
            
            data.forEach((item, index) => {
                const classePosicao = index === 0 ? 'pos-1' : index === 1 ? 'pos-2' : index === 2 ? 'pos-3' : '';
                const iconeOrg = item.perfis.organizacao === 'ER' ? '🛡️' : '🕯️';
                
                body.innerHTML += `
                    <tr class="hover:bg-blue-50 transition-colors">
                        <td class="p-4 text-center font-bold ${classePosicao} rounded-l-xl">${index + 1}º</td>
                        <td class="p-4 font-semibold text-blue-900">${item.perfis.nome}</td>
                        <td class="p-4 text-center">${iconeOrg} ${item.perfis.organizacao}</td>
                        <td class="p-4 text-center font-black text-blue-900 rounded-r-xl">${item.pontos}</td>
                    </tr>
                `;
            });
        }

        // Carrega ao abrir a página
        carregarRanking();
    </script>
</body>
</html>
