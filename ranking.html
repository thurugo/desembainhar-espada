<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    body {
        margin: 0;
        padding: 4px;
        min-height: 100vh;
        display: flex; 
        flex-direction: column; 
        align-items: center;
        color: white; 
        font-family: sans-serif;
        position: relative;
    }

    /* Camada de fundo corrigida: fixa no topo e centralizada na horizontal */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* AJUSTE AQUI: Mudado de 'center center' para 'center top' */
        background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
        background-size: cover; 
        z-index: -1;
    }

    .glass-panel {
        background: rgba(0, 20, 40, 0.6); 
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }
    .pulse-red { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    select { background: rgba(0, 20, 40, 0.8); border: 1px solid rgba(255, 215, 0, 0.3); color: white; }
    option { background: #001428; color: white; }

    /* Efeito de contorno para a página de instruções (pode deixar em todas) */
    .text-contour {
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000,
             0px  4px 10px rgba(0,0,0,0.9);
    }
</style>
</head>
<body class="p-4">

    <div class="w-full max-w-2xl text-center mb-6 mt-4">
        <h1 class="text-4xl font-black text-yellow-400 uppercase tracking-tighter italic">Quadro de Líderes</h1>
        <p class="text-blue-200 text-xs uppercase tracking-[0.2em] mt-1">As 10 Maiores Pontuações</p>
        
        <div id="diagnostico-banco" class="inline-block mt-3 text-[10px] bg-blue-900/60 border border-blue-500/30 px-3 py-1 rounded-full text-blue-300 font-mono">
            Conectando ao banco de dados...
        </div>
    </div>

    <div class="glass-panel w-full max-w-2xl p-4 rounded-2xl mb-4 grid grid-cols-1 sm:grid-cols-3 gap-3 shadow-xl">
        <div>
            <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1">Período:</label>
            <select id="filtro-tempo" onchange="aplicarFiltros()" class="w-full p-2 rounded-lg text-xs outline-none">
                <option value="geral">Todos os Tempos</option>
                <option value="semanal">Esta Semana</option>
                <option value="mensal">Este Mês</option>
            </select>
        </div>
        <div>
            <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1">Categoria de Idade:</label>
            <select id="filtro-idade" onchange="aplicarFiltros()" class="w-full p-2 rounded-lg text-xs outline-none">
                <option value="todos">Todas as Idades</option>
                <option value="juniores">Juniores (9 a 11 anos)</option>
                <option value="adolescentes">Adolescentes (12 a 17 anos)</option>
                <option value="seniors">Sêniors (Acima de 18 anos)</option>
            </select>
        </div>
        <div>
            <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1">Organização:</label>
            <select id="filtro-org" onchange="aplicarFiltros()" class="w-full p-2 rounded-lg text-xs outline-none">
                <option value="todos">Todas as Organizações</option>
                <option value="ER">ER - Embaixadores do Rei</option>
                <option value="MR">MR - Mensageiras do Rei</option>
            </select>
        </div>
    </div>

    <div class="glass-panel w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl mb-6">
        <table class="w-full text-left border-collapse">
            <thead class="bg-yellow-500 text-blue-900 uppercase font-black text-xs">
                <tr>
                    <th class="p-3 pl-4">Pos</th>
                    <th class="p-3">Guerreiro(a)</th>
                    <th class="p-3">Org</th>
                    <th class="p-3 text-center">Permanência</th>
                    <th class="p-3 text-right pr-4">Pontos</th>
                </tr>
            </thead>
            <tbody id="lista-ranking">
                <tr>
                    <td colspan="5" class="p-10 text-center animate-pulse text-blue-200 uppercase text-xs">Carregando classificação...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="flex space-x-4 mb-8">
        <a href="arena.html" class="bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-3 px-6 rounded-xl uppercase shadow-lg text-sm transition-all active:scale-95">
            Voltar à Arena
        </a>
        <a href="index.html" class="bg-blue-600 hover:bg-blue-500 text-white font-black py-3 px-6 rounded-xl uppercase shadow-lg text-sm transition-all active:scale-95">
            Volta ao Início
        </a>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let dadosBrutosRanking = [];

        async function puxarDadosDoSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('ranking')
                    .select(`
                        pontos,
                        criado_em,
                        perfis!jogador_id (
                            nome,
                            organizacao,
                            data_nascimento
                        )
                    `)
                    .order('pontos', { ascending: false });

                if (error) throw error;
                
                dadosBrutosRanking = data || [];
                
                // Atualiza o painel de diagnóstico visual
                const dDiv = document.getElementById('diagnostico-banco');
                dDiv.innerText = `Registros lidos do banco: ${dadosBrutosRanking.length}`;
                if(dadosBrutosRanking.length === 0) {
                    dDiv.className = "inline-block mt-3 text-[10px] bg-red-900/60 border border-red-500/30 px-3 py-1 rounded-full text-red-300 font-mono font-bold animate-pulse";
                    dDiv.innerText += " (Alerta: RLS ativo bloqueando SELECT!)";
                } else {
                    dDiv.className = "inline-block mt-3 text-[10px] bg-green-900/60 border border-green-500/30 px-3 py-1 rounded-full text-green-300 font-mono";
                }

                aplicarFiltros();

            } catch (err) {
                console.error("Erro detalhado do Ranking:", err);
                document.getElementById('lista-ranking').innerHTML = `
                    <tr>
                        <td colspan="5" class="p-10 text-center text-red-400 text-xs font-bold">
                            ERRO AO CONECTAR COM O BANCO DE DADOS:<br>${err.message || err}
                        </td>
                    </tr>`;
            }
        }

        function calcularIdade(dataNasc) {
            if (!dataNasc) return 0;
            const nascimento = new Date(dataNasc);
            const hoje = new Date();
            let idade = hoje.getFullYear() - nascimento.getFullYear();
            const m = hoje.getMonth() - nascimento.getMonth();
            if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
                idade--;
            }
            return idade;
        }

        function aplicarFiltros() {
            const tempo = document.getElementById('filtro-tempo').value;
            const idadeFiltro = document.getElementById('filtro-idade').value;
            const org = document.getElementById('filtro-org').value;
            const agora = new Date();
            
            let dadosFiltrados = dadosBrutosRanking.filter(item => {
                const perfil = item.perfis || { nome: "Jogador de Teste", organizacao: "ER", data_nascimento: "2012-05-15" };
                const dataPontuacao = new Date(item.criado_em);
                
                if (tempo === 'semanal') {
                    const umaSemanaAtras = new Date(agora.getTime() - 7 * 24 * 60 * 60 * 1000);
                    if (dataPontuacao < umaSemanaAtras) return false;
                } else if (tempo === 'mensal') {
                    const umMesAtras = new Date(agora.getTime() - 30 * 24 * 60 * 60 * 1000);
                    if (dataPontuacao < umMesAtras) return false;
                }

                if (org !== 'todos' && perfil.organizacao !== org) return false;

                const idadeReal = calcularIdade(perfil.data_nascimento);
                if (idadeFiltro === 'juniores' && (idadeReal < 9 || idadeReal > 11)) return false;
                if (idadeFiltro === 'adolescentes' && (idadeReal < 12 || idadeReal > 17)) return false;
                if (idadeFiltro === 'seniors' && idadeReal < 18) return false;

                return true;
            });

            renderizarTabela(dadosFiltrados);
        }

        function renderizarTabela(lista) {
            const tbody = document.getElementById('lista-ranking');
            tbody.innerHTML = "";

            const top10 = lista.slice(0, 10);

            if (top10.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-blue-300 uppercase text-xs">Nenhuma pontuação registrada nesta categoria.</td></tr>`;
                return;
            }

            top10.forEach((item, index) => {
                const perfil = item.perfis || { nome: "Jogador de Teste", organizacao: "ER" };
                const orgExibicao = perfil.organizacao || "ER";
                const badgeColor = orgExibicao === 'ER' ? 'bg-blue-600' : 'bg-pink-600';
                
                const dataPontuacao = new Date(item.criado_em);
                const agora = new Date();
                const diffTempo = Math.abs(agora - dataPontuacao);
                const semanas = Math.floor(diffTempo / (1000 * 60 * 60 * 24 * 7));
                
                let textoSemana = `${semanas} sem`;
                if (semanas === 0) textoSemana = "Estreia";

                const row = `
                    <tr class="border-b border-white/5 transition-colors hover:bg-white/5">
                        <td class="p-3 pl-4 font-black ${index === 0 ? 'text-yellow-400 text-lg' : 'text-blue-300'}">${index + 1}º</td>
                        <td class="p-3 font-bold text-sm">${perfil.nome || "Jogador de Teste"}</td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 rounded text-[9px] font-black text-white ${badgeColor}">
                                ${orgExibicao}
                            </span>
                        </td>
                        <td class="p-3 text-center font-mono text-xs text-blue-300 font-bold">${textoSemana}</td>
                        <td class="p-3 text-right pr-4 font-mono font-bold text-yellow-400">${item.pontos}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        window.onload = puxarDadosDoSupabase;
    </script>
</body>
</html>
