<!-- Tela de Cadastro Unificada -->
<div id="auth-container" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl text-gray-800">
    <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-blue-900">Cadastre-se para Jogar</h2>
        <p class="text-gray-500">Escolha sua organização e comece a gincana!</p>
    </div>

    <form id="registro-form" class="space-y-4">
        <!-- Seletor de Organização -->
        <div class="flex gap-4 mb-6">
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="organizacao" value="ER" class="peer hidden" checked>
                <div class="peer-checked:bg-blue-900 peer-checked:text-white border-2 border-blue-900 p-2 text-center rounded-lg text-sm font-bold transition-all">
                    Embaixadores
                </div>
            </label>
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="organizacao" value="MR" class="peer hidden">
                <div class="peer-checked:bg-pink-600 peer-checked:text-white border-2 border-pink-600 p-2 text-center rounded-lg text-sm font-bold transition-all text-pink-600">
                    Mensageiras
                </div>
            </label>
        </div>

        <input type="text" id="reg-nome" placeholder="Nome Completo" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Campo Nome da Igreja -->
    <div class="flex flex-col">
        <label for="reg-igreja" class="text-xs font-bold text-blue-900 mb-1 ml-1 uppercase">Igreja / Grupo</label>
        <input type="text" id="reg-igreja" placeholder="Nome da Igreja" class="p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    <!-- Campo Data de Nascimento com Título Visível -->
    <div class="flex flex-col">
        <label for="reg-nascimento" class="text-xs font-bold text-blue-900 mb-1 ml-1 uppercase">Data de Nascimento</label>
        <input type="date" id="reg-nascimento" class="p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>
</div>

        <input type="email" id="reg-email" placeholder="E-mail" class="w-full p-3 border rounded-lg outline-none" required>
        <input type="password" id="reg-senha" placeholder="Crie uma Senha" class="w-full p-3 border rounded-lg outline-none" required>

        <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition-colors">
            CRIAR CONTA E JOGAR
        </button>
    </form>
    
    <p class="text-center mt-4 text-sm text-gray-600">
        Já tem conta? <a href="index.html" onclick="mostrarLogin()" class="text-blue-700 font-bold">Entrar</a>
    </p>
</div>

<script>
    // Lógica de Registro no Supabase
    // Certifique-se de que o Supabase está inicializado com suas chaves
const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

document.getElementById('registro-form').addEventListener('submit', async (e) => {
    // CRÍTICO: Impede o recarregamento automático da página
    e.preventDefault(); 
    
    const btn = e.target.querySelector('button');
    const originalBtnText = btn.innerText;
    btn.innerText = "PROCESSANDO...";
    btn.disabled = true;

    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-senha').value;
    const nome = document.getElementById('reg-nome').value;
    const nascimento = document.getElementById('reg-nascimento').value;
    const organizacao = document.querySelector('input[name="organizacao"]:checked').value;

    try {
        // 1. Criar usuário no Supabase Auth
        const { data, error } = await supabaseClient.auth.signUp({ 
            email, 
            password,
            options: {
                data: { // Salva metadados básicos no auth
                    full_name: nome,
                    org: organizacao
                }
            }
        });

        if (error) throw error;

        if (data.user) {
            // 2. Salvar dados na tabela 'perfis'
            const { error: profileError } = await supabaseClient
                .from('perfis')
                .insert([{ 
                    id: data.user.id, 
                    nome: nome, 
                    data_nascimento: nascimento, 
                    organizacao: organizacao, 
                    email: email 
                }]);

            if (profileError) throw profileError;

            // 3. Feedback de Sucesso (Não limpa apenas os campos, avisa o usuário)
            document.getElementById('registro-form').innerHTML = `
                <div class="text-center p-6 bg-green-100 rounded-xl border border-green-200">
                    <h3 class="text-green-800 font-bold text-xl mb-2">CADASTRO REALIZADO!</h3>
                    <p class="text-green-700 mb-4">Enviamos um e-mail de confirmação para <strong>${email}</strong>.</p>
                    <p class="text-sm text-green-600 mb-6">Por favor, clique no link enviado para ativar sua conta antes de fazer login.</p>
                    <a href="login.html" class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg font-bold">IR PARA LOGIN</a>
                </div>
            `;
        }
    } catch (err) {
        alert("Erro no cadastro: " + err.message);
        btn.innerText = originalBtnText;
        btn.disabled = false;
    }
});
</script>
