<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro - Desembainhar Espada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0; padding: 4px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-family: sans-serif; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
            background-size: cover; z-index: -1;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.5); /* 50% de Transparência */
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
        /* Correção de cor que aplicamos: Força o texto digitado a ficar escuro e visível */
        input, select {
            color: #0f172a !important;
            background-color: white !important;
        }
        input::placeholder {
            color: #94a3b8 !important;
        }
        .text-contour {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
    </style>
</head>
<body class="p-4">

    <div class="glass-panel w-full max-w-md p-6 rounded-3xl shadow-2xl">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-yellow-400 uppercase tracking-tighter italic text-contour">Criar Nova Conta</h1>
            <p class="text-blue-200 text-[10px] uppercase tracking-widest mt-1">Registre seu perfil de Guerreiro(a)</p>
        </div>

        <form id="form-cadastro" class="space-y-4 text-left">
            
            <div>
                <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1 tracking-wider">Nome Completo:</label>
                <input type="text" id="cad-nome" required class="w-full p-3 rounded-xl outline-none text-sm" placeholder="Ex: Rafael de Miranda">
            </div>

            <div>
                <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1 tracking-wider">E-mail de Acesso:</label>
                <input type="email" id="cad-email" required class="w-full p-3 rounded-xl outline-none text-sm" placeholder="seu-email@provedor.com">
            </div>

            <div>
                <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1 tracking-wider">Senha Secreta:</label>
                <input type="password" id="cad-senha" required class="w-full p-3 rounded-xl outline-none text-sm" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1 tracking-wider">Organização:</label>
                    <select id="cad-org" required class="w-full p-3 rounded-xl outline-none text-sm font-bold">
                        <option value="ER">ER (Embaixadores)</option>
                        <option value="MR">MR (Mensageiras)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase text-yellow-500 font-bold mb-1 tracking-wider">Nascimento:</label>
                    <input type="date" id="cad-nasc" required class="w-full p-3 rounded-xl outline-none text-sm">
                </div>
            </div>

            <button type="submit" id="btn-cadastrar" 
                class="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-2xl shadow-xl uppercase text-md transition-all active:scale-95 mt-2 border border-green-500/20">
                Finalizar Cadastro
            </button>
        </form>

        <div class="mt-5 text-center">
            <a href="index.html" class="text-xs text-blue-300 hover:underline">Voltar à Tela Inicial</a>
        </div>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function realizarCadastro(event) {
            event.preventDefault(); // Impede o recarregamento nativo da página

            const btnCadastro = document.getElementById('btn-cadastrar');
            
            // Captura os valores cravados com os IDs exatos do HTML
            const email = document.getElementById('cad-email').value.trim();
            const senha = document.getElementById('cad-senha').value.trim();
            const nome = document.getElementById('cad-nome').value.trim();
            const organizacao = document.getElementById('cad-org').value;
            const dataNascimento = document.getElementById('cad-nasc').value;

            // Bloqueio visual para evitar cliques múltiplos (Rate Limit)
            btnCadastro.disabled = true;
            btnCadastro.innerText = "FORJANDO CONTA...";

            try {
                // 1. Cria credenciais de autenticação
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: senha
                });

                if (authError) throw authError;

                const usuarioCriado = authData.user;

                if (usuarioCriado) {
                    // 2. Cria a linha de dados na tabela 'perfis'
                    // CORREÇÃO: Alterado de 'jogador_id' para 'id' para bater com seu banco de dados
                    const { error: perfilError } = await supabaseClient
                        .from('perfis')
                        .insert([
                            {
                                id: usuarioCriado.id, 
                                nome: nome,
                                organizacao: organizacao,
                                data_nascimento: dataNascimento,
                                email: email
                            }
                        ]);

                    if (perfilError) throw perfilError;

                    localStorage.setItem('usuario_nome', nome);
                    alert("Cadastro realizado com sucesso! Prepare sua espada.");
                    window.location.href = 'login.html';
                } else {
                    throw new Error("Não foi possível gerar a assinatura do usuário.");
                }

            } catch (error) {
                console.error("Erro capturado no processo:", error);
                
                if (error.message.includes("rate limit")) {
                    alert("Limite de tentativas excedido! Aguarde 5 minutos ou mude do Wi-Fi para o 4G.");
                } else {
                    alert("Erro ao criar conta: " + (error.message || "Verifique os dados informados."));
                }

                // Libera o botão novamente apenas se der erro, permitindo correções
                btnCadastro.disabled = false;
                btnCadastro.innerText = "Finalizar Cadastro";
            }
        }

        // Garante o vínculo seguro da função ao formulário após o carregamento
        window.onload = () => {
            const formulario = document.getElementById('form-cadastro');
            if (formulario) {
                formulario.onsubmit = realizarCadastro;
            }
        };
    </script>
</body>
</html>
