<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro - Desembainhar Espada</title>
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
    body {
        margin: 0;
        padding: 4px;
        min-height: 100vh;
        display: flex; 
        flex-direction: column; 
        align-items: center;
        color: white; 
        font-family: sans-serif;
        position: relative;
    }

    /* Camada de fundo corrigida: fixa no topo e centralizada na horizontal */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* AJUSTE AQUI: Mudado de 'center center' para 'center top' */
        background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
        background-size: cover; 
        z-index: -1;
    }

    .glass-panel {
        background: rgba(0, 20, 40, 0.5); 
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }
    .pulse-red { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    select { background: rgba(0, 20, 40, 0.8); border: 1px solid rgba(255, 215, 0, 0.3); color: white; }
    option { background: #001428; color: white; }

    /* Efeito de contorno para a página de instruções (pode deixar em todas) */
    .text-contour {
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000,
             0px  4px 10px rgba(0,0,0,0.9);
    }
</style>
</head>
<body class="p-2 md:p-6">

    <div id="cadastro-container" class="glass-panel w-full max-w-xl p-6 md:p-10 rounded-3xl shadow-2xl text-white my-4 transition-all duration-500">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-black text-yellow-400 uppercase tracking-tighter shadow-sm">
                Criar Conta
            </h1>
            <p class="text-blue-200 text-xs mt-2 italic tracking-widest uppercase">"Eis-me Aqui"</p>
        </div>

        <!-- Estrutura sem a tag <form> para evitar refresh indesejado -->
        <div class="space-y-5">
            
            <!-- Campo Nome -->
            <div class="flex flex-col">
                <label class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200 tracking-widest">Nome Completo</label>
                <input type="text" id="reg-nome" placeholder="Digite seu nome completo" 
                    class="w-full p-4 rounded-xl outline-none transition-all">
            </div>

            <!-- Grid E-mail e Senha -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200 tracking-widest">E-mail</label>
                    <input type="email" id="reg-email" placeholder="seu@email.com" 
                        class="p-4 rounded-xl outline-none transition-all">
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200 tracking-widest">Senha</label>
                    <input type="password" id="reg-senha" placeholder="Mínimo 6 dígitos" 
                        class="p-4 rounded-xl outline-none transition-all">
                </div>
            </div>

            <!-- Grid Data e Organização -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label for="reg-nascimento" class="text-[10px] font-bold uppercase mb-1 ml-1 text-blue-200 tracking-widest">Data de Nascimento</label>
                    <input type="date" id="reg-nascimento" 
                        class="w-full p-4 rounded-xl outline-none transition-all">
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase mb-2 ml-1 text-blue-200 text-center tracking-widest">Organização</label>
                    <div class="flex justify-around bg-blue-900/40 p-3 rounded-xl border border-white/10">
                        <label class="flex items-center space-x-2 cursor-pointer group">
                            <input type="radio" name="organizacao" value="ER" class="w-4 h-4 accent-yellow-400" checked>
                            <span class="text-sm font-bold group-hover:text-yellow-400 transition-colors">ER</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer group">
                            <input type="radio" name="organizacao" value="MR" class="w-4 h-4 accent-yellow-400">
                            <span class="text-sm font-bold group-hover:text-yellow-400 transition-colors">MR</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Botão de Ação -->
            <button type="button" id="btn-registrar" onclick="executarCadastro()" 
                class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-5 rounded-xl transition-all active:scale-95 shadow-lg uppercase mt-4 text-lg">
                Finalizar Cadastro
            </button>
        </div>

        <div class="mt-8 pt-6 border-t border-white/10 text-center">
            <a href="login.html" class="text-xs text-blue-300 hover:text-yellow-400 underline transition-colors uppercase font-bold tracking-tighter">
                Já possui conta? Clique aqui para entrar
            </a>
        </div>
    </div>

    <script>
        // 1. Configuração Global
const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

// 2. Função Principal com o Plano B (Re-tentativa)
async function executarCadastro() {
    const btn = document.getElementById('btn-registrar');
    
    // Coleta de dados
    const nome = document.getElementById('reg-nome').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-senha').value;
    const nascimento = document.getElementById('reg-nascimento').value;
    const orgEl = document.querySelector('input[name="organizacao"]:checked');
    const organizacao = orgEl ? orgEl.value : 'ER';

    // Validação Básica
    if (!nome || !email || !password || !nascimento) {
        alert("Por favor, preencha todos os campos.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Sincronizando...";

    try {
        // PASSO 1: Registrar no Auth
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: { data: { full_name: nome, org: organizacao } }
        });

        if (error) throw error;

        if (data.user) {
            // PASSO 2: Função interna de re-tentativa (Plano B)
            const salvarPerfilComSeguranca = async (tentativa = 1) => {
                const { error: pError } = await supabaseClient
                    .from('perfis')
                    .upsert({ 
                        id: data.user.id, 
                        nome: nome, 
                        data_nascimento: nascimento, 
                        organizacao: organizacao, 
                        email: email 
                    }, { onConflict: 'id' });

                if (pError) {
                    // Se o erro for de Foreign Key, tenta novamente até 3 vezes
                    if (pError.message.includes("foreign key") && tentativa < 3) {
                        console.log(`Tentativa ${tentativa} falhou. Sincronizando...`);
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        return salvarPerfilComSeguranca(tentativa + 1);
                    }
                    throw pError;
                }
                return true;
            };

            // Executa a gravação do perfil
            await salvarPerfilComSeguranca();

            // PASSO 3: Sucesso Total
            document.getElementById('cadastro-container').innerHTML = `
                <div class="text-center p-8 border-2 border-yellow-400 rounded-3xl bg-blue-900/40">
                    <h2 class="text-yellow-400 font-black text-2xl mb-4">CONTA CRIADA!</h2>
                    <p class="text-white mb-6 leading-relaxed">
                        Enviamos um link de ativação para:<br>
                        <strong class="text-yellow-200">${email}</strong>
                    </p>
                    <a href="login.html" class="inline-block w-full bg-yellow-500 text-blue-900 py-4 rounded-xl font-black uppercase shadow-lg">Ir para Login</a>
                </div>
            `;
        }
    } catch (err) {
        console.error("Erro técnico:", err);
        // Se o erro de FK persistir após as tentativas, o usuário já existe no Auth
        if (err.message.includes("foreign key")) {
            alert("Sua conta foi criada no sistema! Por favor, confirme o e-mail e tente fazer o login.");
            window.location.href = 'login.html';
        } else {
            alert("Erro no cadastro: " + err.message);
        }
        btn.disabled = false;
        btn.innerText = "FINALIZAR CADASTRO";
    }
}   
    </script>
</body>
</html>
