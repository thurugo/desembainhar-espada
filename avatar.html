<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quartel General - Minhas Conquistas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0; padding: 4px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            color: white; font-family: sans-serif; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('imagens/fundo_entrada_new.webp') no-repeat center top;
            background-size: cover; z-index: -1;
        }
        .glass-panel {
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
        .text-contour {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(147, 51, 234, 0.5); border-radius: 10px; }
    </style>
</head>
<body class="p-4">

    <div class="w-full max-w-5xl flex flex-col lg:flex-row gap-6 my-4">
        
        <div class="glass-panel flex-1 p-6 rounded-3xl flex flex-col items-center text-center justify-center min-h-[300px]">
            <div class="mb-4">
                <div class="bg-blue-600/30 text-blue-300 border border-blue-500/30 text-[10px] uppercase font-black px-3 py-1 rounded-full tracking-widest inline-block mb-2">
                    Guerreiro de Elite
                </div>
                <h1 id="player-name" class="text-2xl font-black text-yellow-400 uppercase italic text-contour">Carregando...</h1>
                <p id="player-org" class="text-xs text-gray-400 uppercase font-bold tracking-wider mb-4">-</p>
            </div>

            <div class="w-full bg-black/30 border border-dashed border-white/10 p-6 rounded-2xl text-center">
                <span class="text-3xl block mb-2">⚒️</span>
                <span class="text-xs text-yellow-500 font-bold block uppercase tracking-wider">Forja de Avatares</span>
                <span class="text-[10px] text-gray-400 block mt-1">Os modelos gráficos 3D/2D estão sendo preparados. Colecione suas medalhas enquanto isso!</span>
            </div>
        </div>

        <div class="flex-[1.5] flex flex-col">
            <div class="glass-panel p-6 rounded-3xl flex-1 flex flex-col">
                <h2 class="text-lg font-black uppercase text-amber-400 tracking-wider mb-1 italic text-left border-b border-white/10 pb-2">🏅 Mural Histórico de Medalhas de Honra</h2>
                <p class="text-[11px] text-gray-400 mb-4 text-left">Pódios conquistados nas apurações Semanais, Mensais, Semestrais e Anuais.</p>
                
                <div id="grade-medalhas" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto custom-scroll pr-1 max-h-[460px]">
                    <!-- Medalhas injetadas dinamicamente -->
                </div>
            </div>
        </div>
    </div>

    <div class="flex space-x-4 mb-8 w-full max-w-5xl justify-center">
        <a href="modulos.html" class="bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-black py-3 px-6 rounded-xl uppercase shadow-lg text-sm transition-all active:scale-95 text-center flex-1 max-w-xs">
            Voltar aos Módulos
        </a>
        <a href="index.html" class="bg-black/40 hover:bg-black/60 text-white font-bold py-3 px-6 rounded-xl border border-white/10 uppercase shadow-lg text-sm transition-all active:scale-95 text-center flex-1 max-w-xs">
            Tela Inicial
        </a>
    </div>

    <script>
        const SB_URL = "https://blpvsgldhvmtbbowrttk.supabase.co";
        const SB_KEY = "sb_publishable_bPuQQEzClwdb_UisF96wWg_HX4XsiZ0";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        let perfilJogador = null;

        window.onload = async () => {
            await carregarDadosPerfil();
        };

        async function carregarDadosPerfil() {
            try {
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                if (authError || !user) {
                    alert("Por favor realize o login.");
                    window.location.href = 'login.html';
                    return;
                }

                const { data: perfil, error: pError } = await supabaseClient
                    .from('perfis')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (pError) throw pError;
                perfilJogador = perfil;

                document.getElementById('player-name').innerText = perfilJogador.nome;
                document.getElementById('player-org').innerText = perfilJogador.organizacao === "ER" ? "Embaixadores do Rei" : "Mensageiras do Rei";

                await renderizarMuralMedalhas();

            } catch (err) {
                console.error("Erro ao carregar o perfil:", err);
            }
        }

        async function renderizarMuralMedalhas() {
            const container = document.getElementById('grade-medalhas');
            container.innerHTML = "";

            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;
                
                const { data: medalhasGanhas, error } = await supabaseClient
                    .from('medalhas_historico')
                    .select('*')
                    .eq('jogador_id', user.id);

                if (error) throw error;

                if (!medalhasGanhas || medalhasGanhas.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-xs text-gray-500 py-12 italic">Nenhuma medalha de pódio obtida até o momento. Continue batalhando nas Arenas!</p>`;
                    return;
                }

                // Dicionário atualizado com o novo módulo "montagem_biblica"
                const nomesModulos = { 
                    regular: "Tradicional", 
                    avancado: "Avançado", 
                    gerais_biblia: "Gerais da Bíblia",
                    montagem_biblica: "Montagem Bíblica" 
                };
                
                const nomesEscopos = {
                    idade: "Líder Categoria Local",
                    geral_idade: "Líder Geral de Idades",
                    organizacao: "Líder da Organização",
                    geral_organizacao: "Líder Geral da Organização",
                    livro_livre: "Pódio Absoluto Livre"
                };

                medalhasGanhas.forEach(med => {
                    const nomeDoModulo = nomesModulos[med.modulo] || "Arena";
                    const nomeDoEscopo = nomesEscopos[med.escopo] || "Conquista";
                    
                    let urlImagemMedalha = `imagens/medalhas_${med.tipo_medalha}.png`;
                    if (med.escopo === 'livro_livre') {
                        urlImagemMedalha = `imagens/medalhas_${med.tipo_medalha}-supreme.png`;
                    }

                    let legendaPeriodo = `Ciclo: ${med.data_domingo}`;
                    if(med.periodo_tipo !== 'semanal') {
                        legendaPeriodo = `${med.periodo_tipo.toUpperCase()} - Ref: ${med.data_domingo.substring(0,7)}`;
                    }

                    container.innerHTML += `
                        <div class="bg-black/40 border border-white/5 p-3 rounded-2xl flex flex-col items-center text-center justify-between min-h-[150px] shadow-lg">
                            <img src="${urlImagemMedalha}" class="w-12 h-12 object-contain mb-2 drop-shadow-[0_4px_6px_rgba(0,0,0,0.6)]" alt="Medalha">
                            <div>
                                <span class="block text-[10px] font-black tracking-wide uppercase text-yellow-400 leading-tight">${nomeDoEscopo}</span>
                                <span class="block text-[9px] text-gray-400 mt-1 font-medium">${nomeDoModulo}</span>
                                <span class="block text-[8px] text-purple-400 font-mono mt-1">${legendaPeriodo}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Erro detalhado do Mural:", err);
                container.innerHTML = `<p class="col-span-full text-center text-xs text-red-400 font-bold">Erro ao carregar o mural.</p>`;
            }
        }
    </script>
</body>
</html>
